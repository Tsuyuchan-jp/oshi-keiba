<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>パドック 遷移比較</title>
  <link rel="stylesheet" href="./paddock.css">
</head>
<body class="transition-demo">
  <main class="vote-scene">
    <section class="vote-card">
      <p class="eyebrow">Vote window</p>
      <h1>投票窓口</h1>
      <p>暗い投票画面から、昼のパドックへ移るときの明るさを比較します。</p>
      <div class="vote-preview">
        <span>注目馬</span>
        <strong>7番　ゴールドシップ</strong>
        <small>追込　暫定 9.4倍</small>
      </div>
      <p class="transition-hint">下のボタンを押すたびに、パドック到着時の見え方を確認できます。</p>
      <div class="transition-choices">
        <a href="./index.html?fade=none">切替なし<small>0秒</small></a>
        <a href="./index.html?fade=standard">標準フェード<small>0.3秒</small></a>
        <a href="./index.html?fade=slow">ゆっくりフェード<small>0.5秒</small></a>
      </div>
    </section>
  </main>
</body>
</html>
