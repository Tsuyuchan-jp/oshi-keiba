<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>号外プレビュー v2 — oshi-keiba</title>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --green: #6fbf2a;
      --green-dark: #4a9a18;
      --orange: #ff9900;
      --paper: #f7f7f4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "M PLUS 1p", "Hiragino Sans", sans-serif;
      background: #2a3038;
      color: #1a1a1a;
    }

    /* ---- ステージ ---- */
    .stage {
      max-width: 26rem;
      margin: 0 auto;
      padding: 1rem 0.8rem 3rem;
    }
    .note {
      color: #9aa4b0;
      font-size: 0.78rem;
      line-height: 1.5;
      margin: 0 0 0.75rem;
    }

    /* ---- 紙面 ---- */
    .paper {
      background: var(--paper);
      border-radius: 3px;
      overflow: hidden;
      box-shadow: 0 14px 48px rgba(0,0,0,.45);
    }

    /* 1. マストヘッド */
    .masthead {
      background:
        repeating-linear-gradient(-45deg,
          rgba(255,255,255,.13) 0 7px,
          transparent 7px 14px),
        linear-gradient(180deg, var(--green), var(--green-dark));
      color: #fff;
      text-align: center;
      font-weight: 800;
      font-size: 0.92rem;
      letter-spacing: 0.14em;
      padding: 0.5rem 0.6rem;
      text-shadow: 0 1px 0 rgba(0,0,0,.18);
    }

    /* 2. カバー */
    .cover {
      position: relative;
      /* gogai_bg は横 1024×縦 512 */
      height: 20rem;
      overflow: hidden;
      background: #bcd4e0;
    }
    .cover-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 30%;
    }
    /* 立ち絵：透過PNGを bg より前、title より後 */
    .cover-stand {
      position: absolute;
      left: 2%;
      bottom: -6%;
      height: 106%;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,.35));
      z-index: 1;
    }
    /* 縦書きオーバーレイ：title画像 + subtitle画像を横並びで右端に */
    .cover-titles {
      position: absolute;
      right: 0.3rem;
      top: 0.5rem;
      bottom: 0.8rem;
      display: flex;
      flex-direction: row;   /* 右から: name列→subtitle列 */
      direction: rtl;
      align-items: flex-start;
      gap: 0.2rem;
      z-index: 2;
    }
    /* title画像（256×1024）をそのまま縦長で表示 */
    .cover-titles img.title-img {
      height: 100%;
      width: auto;
      object-fit: contain;
      direction: ltr;
    }
    /* subtitle画像（128×1024）*/
    .cover-titles img.subtitle-img {
      height: 85%;
      width: auto;
      object-fit: contain;
      direction: ltr;
      align-self: flex-start;
    }
    /* 画像がないときのテキストフォールバック */
    .cover-titles .title-text {
      writing-mode: vertical-rl;
      direction: ltr;
      font-size: 1.75rem;
      font-weight: 800;
      color: #ffe44a;
      -webkit-text-stroke: 6px #d51a2a;
      paint-order: stroke fill;
      letter-spacing: 0.07em;
    }
    .cover-titles .sub-text {
      writing-mode: vertical-rl;
      direction: ltr;
      font-size: 0.9rem;
      font-weight: 800;
      color: #ffe44a;
      -webkit-text-stroke: 3px #d51a2a;
      paint-order: stroke fill;
      letter-spacing: 0.18em;
    }

    /* 3. トレーナー段 */
    .trainer {
      display: grid;
      grid-template-columns: 4rem 1fr;
      gap: 0.65rem;
      align-items: center;
      padding: 0.75rem 0.85rem;
      background: #fff;
      border-bottom: 1px solid #e2e2dc;
    }
    .trainer img {
      width: 4rem;
      height: 4rem;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--green);
      background: #111;
    }
    .trainer .role  { font-size: 0.65rem; font-weight: 700; color: var(--green-dark); letter-spacing: .08em; }
    .trainer .who   { font-size: 1.25rem; font-weight: 800; line-height: 1.2; margin: 0.1rem 0 0.2rem; }
    .trainer .uma   { font-size: 0.78rem; color: #4a4a4a; }

    /* 4. 本文 */
    .article {
      padding: 0.8rem 0.85rem 0.9rem;
      background: #fff;
      font-size: 0.86rem;
      line-height: 1.72;
      border-bottom: 1px solid #e2e2dc;
    }
    .article .lead  { color: var(--orange); font-weight: 800; }

    /* 5. 2着・3着 */
    .places-h {
      background: var(--green);
      color: #fff;
      font-weight: 800;
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      padding: 0.3rem 0.75rem;
      clip-path: polygon(0 0, 100% 0, calc(100% - 1rem) 100%, 0 100%);
      width: 40%;
    }
    .places {
      padding: 0.3rem 0.45rem 0.5rem;
      background: #eef6ea;
    }
    .place {
      display: grid;
      grid-template-columns: 1.9rem 3rem 2.4rem 1fr;
      gap: 0.4rem;
      align-items: center;
      padding: 0.4rem 0.2rem;
      border-bottom: 1px solid #d5e6cc;
    }
    .place:last-child { border-bottom: 0; }
    .place .n         { font-weight: 800; font-size: 0.88rem; color: var(--green-dark); text-align: center; }
    .place .petit     { width: 3rem; height: 3rem; object-fit: contain; }
    .place .icon      {
      width: 2.4rem; height: 2.4rem; border-radius: 50%;
      object-fit: cover; border: 2px solid #fff;
      box-shadow: 0 0 0 1px #c5d8bc; background: #111;
    }
    .place .who  { font-size: 0.88rem; font-weight: 800; line-height: 1.2; margin: 0; }
    .place .uma  { font-size: 0.72rem; color: #4a4a4a; margin-top: 0.1rem; }
  </style>
</head>
<body>
  <div class="stage">
    <p class="note">
      号外 v2 プレビュー。背景・title・subtitle は public/twinkle の実アセット。
      立ち絵は前回の仮画像。本文は 230_headline_body.csv の実テキストをそのまま使用。
    </p>
    <article class="paper">

      <!-- 1. マストヘッド -->
      <header class="masthead">月刊トゥインクル　号外</header>

      <!-- 2. カバー -->
      <div class="cover">
        <!-- gogai_bg.png: レース場ぼかし背景 -->
        <img class="cover-bg"
          src="../../../public/twinkle/frames/gogai_bg.png"
          alt="">

        <!-- 立ち絵（透過PNG・下寄せ） -->
        <img class="cover-stand"
          src="stand-preview.png"
          alt="スペシャルウィーク">

        <!-- 縦書き見出し：右からsubtitle→title の順に並ぶ -->
        <div class="cover-titles">
          <!--
            title画像: titles/{id}.png（256×1024）
            今回は id=3「激戦必至」を仮使用。
            本番では chara_id / round_id から win_title.json で id を決定する。
          -->
          <img class="title-img"
            src="../../../public/twinkle/titles/003.png"
            alt="激戦必至"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
          <span class="title-text" style="display:none">激戦必至</span>

          <!--
            subtitle画像: subtitles/{id}.png（128×1024）
            ゲーム固有の大会名が入るためここでは出さない。
            本番実装時に推し大会向けの別文言を決める。
          -->
        </div>
      </div>

      <!-- 3. トレーナー情報 -->
      <section class="trainer" aria-label="1着トレーナー">
        <img src="trainer-icon.png" alt="">
        <div>
          <div class="role">出走者</div>
          <p class="who">プレビュー太郎</p>
          <div class="uma">1番　スペシャルウィーク</div>
        </div>
      </section>

      <!-- 4. 本文（230_headline_body.csv id=201 + id=301 を組み合わせ。<color>タグを <span> に変換済み） -->
      <div class="article">
        完璧な走りで
        <span class="lead">「プレビュー太郎」</span>
        に大きな1勝を届けた。
        これからの活躍に大きく期待できそうだ！
      </div>

      <!-- 5. 2着・3着 -->
      <div class="places-h">2着・3着</div>
      <section class="places" aria-label="2着と3着">
        <div class="place">
          <div class="n">2着</div>
          <img class="petit"
            src="../../../public/images/umamusume/petit/petit_1002_100201_0010.png"
            alt="">
          <img class="icon" src="trainer-icon.png" alt="">
          <div>
            <p class="who">プレビュー花子</p>
            <div class="uma">サイレンススズカ</div>
          </div>
        </div>
        <div class="place">
          <div class="n">3着</div>
          <img class="petit"
            src="../../../public/images/umamusume/petit/petit_1003_100301_0010.png"
            alt="">
          <img class="icon" src="trainer-icon.png" alt="">
          <div>
            <p class="who">プレビュー次郎</p>
            <div class="uma">トウカイテイオー</div>
          </div>
        </div>
      </section>

    </article>
  </div>
</body>
</html>
