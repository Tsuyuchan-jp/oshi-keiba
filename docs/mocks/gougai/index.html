<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>号外プレビュー v2 — oshi-keiba</title>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --green: #6fbf2a;
      --green-dark: #4a9a18;
      --orange: #ff9900;
      --paper: #f7f7f4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "M PLUS 1p", "Hiragino Sans", sans-serif;
      background: #2a3038;
      color: #1a1a1a;
    }

    /* ---- ステージ ---- */
    .stage {
      max-width: 26rem;
      margin: 0 auto;
      padding: 1rem 0.8rem 3rem;
    }
    .note {
      color: #9aa4b0;
      font-size: 0.78rem;
      line-height: 1.5;
      margin: 0 0 0.75rem;
    }

    /* ---- 紙面 ---- */
    .paper {
      background: var(--paper);
      border-radius: 3px;
      overflow: hidden;
      box-shadow: 0 14px 48px rgba(0,0,0,.45);
    }

    /* 1. マストヘッド */
    .masthead {
      background:
        repeating-linear-gradient(-45deg,
          rgba(255,255,255,.13) 0 7px,
          transparent 7px 14px),
        linear-gradient(180deg, var(--green), var(--green-dark));
      color: #fff;
      text-align: center;
      font-weight: 800;
      font-size: 0.92rem;
      letter-spacing: 0.14em;
      padding: 0.5rem 0.6rem;
      text-shadow: 0 1px 0 rgba(0,0,0,.18);
    }

    /* 2. カバー */
    .cover {
      position: relative;
      /* gogai_bg は横 1024×縦 512 */
      height: 20rem;
      overflow: hidden;
      background: #bcd4e0;
    }
    .cover-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 30%;
    }
    /* 右側の青塗り（ゲーム号外の縦書き帯）。背景の上・立ち絵の下 */
    .cover-blue {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 24%;
      background: #4a22e1;
      z-index: 1;
    }
    /* 立ち絵：透過PNGを bg より前、title より後 */
    .cover-stand {
      position: absolute;
      left: 2%;
      bottom: -6%;
      height: 106%;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,.35));
      z-index: 2;
    }
    /* 縦書き3列：右から subtitle画像 → キャッチ → ウマ娘名 */
    .cover-titles {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 24%;
      display: flex;
      flex-direction: row;
      direction: rtl;
      justify-content: flex-start;
      align-items: flex-start;
      gap: 0.12rem;
      padding: 0.45rem 0.28rem 0.55rem;
      z-index: 3;
      pointer-events: none;
    }
    .cover-titles > * { direction: ltr; }
    /* 右列: 324.png。元画像は縦が約3/4に潰れているので 4/3 倍に伸ばす */
    .cover-titles .sub-img-wrap {
      height: 42%;
      width: 1.05rem;
      overflow: hidden;
      flex-shrink: 0;
    }
    .cover-titles .sub-img-wrap img {
      display: block;
      width: 100%;
      height: calc(100% * 4 / 3);
      object-fit: fill;
      object-position: top center;
      /* 黒背景の焼き込みを青帯の上で抜く */
      mix-blend-mode: screen;
    }
    .cover-titles span {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-weight: 800;
      line-height: 1.05;
      paint-order: stroke fill;
    }
    /* 2列目: 「見事チャンピオンに」赤字・黄縁（最強ウマ娘相当） */
    .cover-titles .catch {
      font-size: 1.22rem;
      color: #e31b23;
      -webkit-text-stroke: 4px #ffe44a;
      text-shadow: 1px 1px 0 #7a0d18;
      letter-spacing: 0.08em;
      margin-top: 1.6rem;
    }
    /* 3列目: ウマ娘名 黄字・赤縁（いちばん大きい） */
    .cover-titles .uma-name {
      font-size: 1.48rem;
      color: #ffe44a;
      -webkit-text-stroke: 5px #d51a2a;
      text-shadow: 2px 2px 0 #7a0d18;
      letter-spacing: 0.06em;
      margin-top: 2.4rem;
    }

    /* 3. トレーナー段 */
    .trainer {
      display: grid;
      grid-template-columns: 4rem 1fr;
      gap: 0.65rem;
      align-items: center;
      padding: 0.75rem 0.85rem;
      background: #fff;
      border-bottom: 1px solid #e2e2dc;
    }
    .trainer img {
      width: 4rem;
      height: 4rem;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--green);
      background: #111;
    }
    .trainer .role  { font-size: 0.65rem; font-weight: 700; color: var(--green-dark); letter-spacing: .08em; }
    .trainer .who   { font-size: 1.25rem; font-weight: 800; line-height: 1.2; margin: 0.1rem 0 0.2rem; }
    .trainer .uma   { font-size: 0.78rem; color: #4a4a4a; }

    /* 4. 本文 */
    .article {
      padding: 0.8rem 0.85rem 0.9rem;
      background: #fff;
      font-size: 0.86rem;
      line-height: 1.72;
      border-bottom: 1px solid #e2e2dc;
    }
    .article .lead  { color: var(--orange); font-weight: 800; }

    /* 5. 2着・3着 */
    .places-h {
      background: var(--green);
      color: #fff;
      font-weight: 800;
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      padding: 0.3rem 0.75rem;
      clip-path: polygon(0 0, 100% 0, calc(100% - 1rem) 100%, 0 100%);
      width: 40%;
    }
    .places {
      padding: 0.3rem 0.45rem 0.5rem;
      background: #eef6ea;
    }
    .place {
      display: grid;
      grid-template-columns: 1.9rem 3rem 2.4rem 1fr;
      gap: 0.4rem;
      align-items: center;
      padding: 0.4rem 0.2rem;
      border-bottom: 1px solid #d5e6cc;
    }
    .place:last-child { border-bottom: 0; }
    .place .n         { font-weight: 800; font-size: 0.88rem; color: var(--green-dark); text-align: center; }
    .place .petit     { width: 3rem; height: 3rem; object-fit: contain; }
    .place .icon      {
      width: 2.4rem; height: 2.4rem; border-radius: 50%;
      object-fit: cover; border: 2px solid #fff;
      box-shadow: 0 0 0 1px #c5d8bc; background: #111;
    }
    .place .who  { font-size: 0.88rem; font-weight: 800; line-height: 1.2; margin: 0; }
    .place .uma  { font-size: 0.72rem; color: #4a4a4a; margin-top: 0.1rem; }
  </style>
</head>
<body>
  <div class="stage">
    <p class="note">
      号外プレビュー。メイン右は青帯＋縦3列（324.png を縦伸ばし、571番を \n で2列）。
      背景・立ち絵は前回のまま。
    </p>
    <article class="paper">

      <!-- 1. マストヘッド -->
      <header class="masthead">月刊トゥインクル　号外</header>

      <!-- 2. カバー -->
      <div class="cover">
        <!-- gogai_bg.png: レース場ぼかし背景 -->
        <img class="cover-bg"
          src="../../../public/twinkle/frames/gogai_bg.png"
          alt="">

        <!-- 立ち絵（透過PNG・下寄せ）。今回はそのまま -->
        <img class="cover-stand"
          src="stand-preview.png"
          alt="スペシャルウィーク">

        <!-- 右側の青塗り帯（ゲーム号外の縦書きエリア） -->
        <div class="cover-blue" aria-hidden="true"></div>

        <!--
          縦書き3列（右→左）
          1. subtitles/324.png（縦を 4/3 に伸ばして字形を戻す）
          2–3. 229_overlay_vertical.csv id=571 を \n で分割
             スペシャルウィーク / 見事チャンピオンに
        -->
        <div class="cover-titles">
          <div class="sub-img-wrap">
            <img src="../../../public/twinkle/subtitles/324.png" alt="鮮やかな勝利！">
          </div>
          <span class="catch">見事チャンピオンに</span>
          <span class="uma-name">スペシャルウィーク</span>
        </div>
      </div>

      <!-- 3. トレーナー情報 -->
      <section class="trainer" aria-label="1着トレーナー">
        <img src="trainer-icon.png" alt="">
        <div>
          <div class="role">出走者</div>
          <p class="who">プレビュー太郎</p>
          <div class="uma">1番　スペシャルウィーク</div>
        </div>
      </section>

      <!-- 4. 本文（230_headline_body.csv id=201 + id=301 を組み合わせ。<color>タグを <span> に変換済み） -->
      <div class="article">
        完璧な走りで
        <span class="lead">「プレビュー太郎」</span>
        に大きな1勝を届けた。
        これからの活躍に大きく期待できそうだ！
      </div>

      <!-- 5. 2着・3着 -->
      <div class="places-h">2着・3着</div>
      <section class="places" aria-label="2着と3着">
        <div class="place">
          <div class="n">2着</div>
          <img class="petit"
            src="../../../public/images/umamusume/petit/petit_1002_100201_0010.png"
            alt="">
          <img class="icon" src="trainer-icon.png" alt="">
          <div>
            <p class="who">プレビュー花子</p>
            <div class="uma">サイレンススズカ</div>
          </div>
        </div>
        <div class="place">
          <div class="n">3着</div>
          <img class="petit"
            src="../../../public/images/umamusume/petit/petit_1003_100301_0010.png"
            alt="">
          <img class="icon" src="trainer-icon.png" alt="">
          <div>
            <p class="who">プレビュー次郎</p>
            <div class="uma">トウカイテイオー</div>
          </div>
        </div>
      </section>

    </article>
  </div>
</body>
</html>
