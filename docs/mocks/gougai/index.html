<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>号外プレビュー — 本文帯の比較</title>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --green: #6fbf2a;
      --green-dark: #4a9a18;
      --orange: #ff9900;
      --paper: #f7f7f4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "M PLUS 1p", "Hiragino Sans", sans-serif;
      background: #2a3038;
      color: #1a1a1a;
    }

    .stage {
      max-width: 26rem;
      margin: 0 auto;
      padding: 1rem 0.8rem 3rem;
    }
    .note {
      color: #9aa4b0;
      font-size: 0.78rem;
      line-height: 1.5;
      margin: 0 0 0.75rem;
    }
    .variant-h {
      color: #c9d4de;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      margin: 1.6rem 0 0.45rem;
    }
    .variant-h:first-of-type { margin-top: 0.4rem; }

    .paper {
      background: var(--paper);
      border-radius: 3px;
      overflow: hidden;
      box-shadow: 0 14px 48px rgba(0,0,0,.45);
    }

    .masthead {
      background:
        repeating-linear-gradient(-45deg,
          rgba(255,255,255,.13) 0 7px,
          transparent 7px 14px),
        linear-gradient(180deg, var(--green), var(--green-dark));
      color: #fff;
      text-align: center;
      font-weight: 800;
      font-size: 0.92rem;
      letter-spacing: 0.14em;
      padding: 0.5rem 0.6rem;
      text-shadow: 0 1px 0 rgba(0,0,0,.18);
    }

    .cover {
      position: relative;
      --cover-h: 20rem;
      --cover-pad-y: 0.6rem;
      --cover-inner-h: calc(var(--cover-h) - 2 * var(--cover-pad-y));
      height: var(--cover-h);
      overflow: hidden;
      background: #bcd4e0;
    }
    .cover-bg {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 85%;
      height: 100%;
      object-fit: cover;
      object-position: center 40%;
    }
    .cover-blue {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 15%;
      background: #4a22e1;
      z-index: 1;
    }
    .cover-stand {
      position: absolute;
      left: -4%;
      bottom: -6%;
      height: 106%;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,.35));
      z-index: 2;
    }
    .cover-titles {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 36%;
      display: flex;
      flex-direction: row;
      direction: rtl;
      justify-content: flex-start;
      align-items: flex-start;
      gap: 0.35rem;
      padding: var(--cover-pad-y) 0.35rem;
      overflow: hidden;
      z-index: 3;
      pointer-events: none;
    }
    .cover-titles > * { direction: ltr; }
    .cover-titles .sub-img-wrap {
      height: calc(var(--cover-inner-h) * 7 / 9);
      width: 1.55rem;
      overflow: hidden;
      flex-shrink: 0;
    }
    .cover-titles .sub-img-wrap img {
      display: block;
      width: 100%;
      height: calc(100% * 4 / 3);
      object-fit: fill;
      object-position: top center;
      mix-blend-mode: screen;
    }
    .cover-titles .col-text {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-family: "M PLUS 1p", "Hiragino Sans", sans-serif;
      font-weight: 900;
      font-size: calc(var(--cover-inner-h) / 9);
      line-height: 1;
      letter-spacing: 0;
      color: #e31b23;
      -webkit-text-stroke: 0.07em #ffe44a;
      paint-order: stroke fill;
    }

    /* ---- 本文（共通: 太字） ---- */
    .article {
      position: relative;
      font-size: 0.86rem;
      font-weight: 800;
      line-height: 1.72;
    }
    .article p { margin: 0; }
    .article .lead { color: var(--orange); font-weight: 900; }

    /* A: マストヘッドと同系統の緑斜線＋左帯＋記者ラベル */
    .article-a {
      padding: 0.55rem 0.85rem 0.75rem 1.05rem;
      background:
        repeating-linear-gradient(-45deg,
          rgba(111,191,42,.09) 0 7px,
          transparent 7px 14px),
        #f4faee;
      border-left: 6px solid var(--green);
    }
    .article-a .kicker {
      display: inline-block;
      margin: 0 0 0.4rem;
      padding: 0.12rem 0.55rem 0.14rem;
      background: var(--green);
      color: #fff;
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      clip-path: polygon(0 0, 100% 0, calc(100% - 0.45rem) 100%, 0 100%);
    }

    /* B: 競馬新聞（罫線・号外スタンプ・新聞紙色） */
    .article-b {
      display: grid;
      grid-template-columns: 1.55rem 1fr;
      gap: 0.45rem;
      padding: 0.55rem 0.7rem 0.7rem;
      background-color: #efe4c4;
      background-image: repeating-linear-gradient(
        0deg, transparent 0 3px, rgba(80,50,10,.05) 3px 4px
      );
      box-shadow:
        inset 0 3px 0 #1a1a1a,
        inset 0 5px 0 #efe4c4,
        inset 0 7px 0 #1a1a1a,
        inset 0 -3px 0 #1a1a1a;
    }
    .article-b .stamp {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      justify-self: center;
      align-self: start;
      margin-top: 0.15rem;
      padding: 0.25rem 0.12rem;
      border: 2px solid #c41212;
      color: #c41212;
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 0.18em;
      line-height: 1;
    }
    .article-b .byline {
      display: block;
      margin: 0 0 0.28rem;
      color: #5a4a28;
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.14em;
    }

    /* C: 本戦詳報（オレンジ破線枠＋見出し帯） */
    .article-c {
      margin: 0.35rem 0.4rem 0.4rem;
      padding: 0;
      background: #fff7ea;
      border: 2px dashed var(--orange);
    }
    .article-c .kicker {
      display: block;
      margin: 0;
      padding: 0.22rem 0.65rem;
      background: linear-gradient(90deg, var(--orange), #ffb340);
      color: #fff;
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-shadow: 0 1px 0 rgba(0,0,0,.15);
    }
    .article-c p { padding: 0.55rem 0.7rem 0.65rem; }

    /* D: 誌面ボックス（緑橙の走路ストライプ＋白カード） */
    .article-d {
      padding: 0.45rem 0.5rem 0.5rem;
      background: #e8f3ea;
    }
    .article-d .inner {
      padding: 0.55rem 0.65rem 0.6rem;
      background: #fff;
      border: 2px solid #d7e6cc;
      box-shadow: 0 2px 0 rgba(74,154,24,.15);
    }
    .article-d .stripe {
      display: block;
      height: 6px;
      margin: -0.55rem -0.65rem 0.5rem;
      background: repeating-linear-gradient(
        90deg,
        var(--orange) 0 12px,
        #fff 12px 18px,
        var(--green) 18px 30px,
        #fff 30px 36px
      );
    }

    .trainer {
      position: relative;
      aspect-ratio: 8 / 3;
      overflow: hidden;
    }
    .trainer-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
    }
    .trainer-inner {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.55rem 0.85rem;
    }
    .trainer-inner img {
      width: 3.4rem;
      height: 3.4rem;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #fff;
      background: #111;
      box-shadow: 0 1px 6px rgba(0,0,0,.25);
      flex-shrink: 0;
    }
    .trainer .role { font-size: 0.62rem; font-weight: 700; color: #1a4a78; letter-spacing: .08em; }
    .trainer .who  { font-size: 1.15rem; font-weight: 800; line-height: 1.2; margin: 0.08rem 0 0.12rem; color: #122; }
    .trainer .uma  { font-size: 0.74rem; color: #334; }
  </style>
</head>
<body>
  <div class="stage">
    <p class="note">
      本文帯の見た目比較（文言・太字は共通）。メインとトレーナー帯は同じ。採用は未定。
    </p>
    <div id="variants"></div>
  </div>

  <template id="paper-tpl">
    <article class="paper">
      <header class="masthead">月刊トゥインクル　号外</header>
      <div class="cover">
        <img class="cover-bg" src="../../../public/twinkle/frames/gogai_bg.png" alt="">
        <img class="cover-stand" src="stand-preview.png" alt="スペシャルウィーク">
        <div class="cover-blue" aria-hidden="true"></div>
        <div class="cover-titles">
          <div class="sub-img-wrap">
            <img src="../../../public/twinkle/subtitles/324.png" alt="鮮やかな勝利！">
          </div>
          <span class="col-text">スペシャルウィーク</span>
          <span class="col-text">見事チャンピオンに</span>
        </div>
      </div>
      <div class="article-slot"></div>
      <section class="trainer" aria-label="1着トレーナー">
        <img class="trainer-bg" src="../../../public/twinkle/frames/zokan_page1_bg.png" alt="">
        <div class="trainer-inner">
          <img src="trainer-icon.png" alt="">
          <div>
            <div class="role">出走者</div>
            <p class="who">プレビュー太郎</p>
            <div class="uma">1番　スペシャルウィーク</div>
          </div>
        </div>
      </section>
    </article>
  </template>

  <script>
    const bodyHtml = `
      <span class="lead">プレビュー杯</span>
      本戦！並みいる猛者を退け勝ったのは
      <span class="lead">スペシャルウィーク</span>！
      <span class="lead">「プレビュー太郎」</span>
      との信頼が生んだ最高の結末だ。
      優勝に相応しい、素晴らしい走りを見せてくれた。
      こんな走りを見られたことに、ただただ感謝したい。
    `;
    const variants = [
      {
        id: "a",
        title: "A. トゥインクル緑斜線",
        html: `<div class="article article-a"><span class="kicker">優勝レポート</span><p>${bodyHtml}</p></div>`
      },
      {
        id: "b",
        title: "B. 競馬新聞・号外スタンプ",
        html: `<div class="article article-b"><span class="stamp">号外</span><div><span class="byline">本紙・場内取材</span><p>${bodyHtml}</p></div></div>`
      },
      {
        id: "c",
        title: "C. 本戦詳報（オレンジ破線）",
        html: `<div class="article article-c"><span class="kicker">本戦詳報</span><p>${bodyHtml}</p></div>`
      },
      {
        id: "d",
        title: "D. 走路ストライプ＋白カード",
        html: `<div class="article article-d"><div class="inner"><span class="stripe" aria-hidden="true"></span><p>${bodyHtml}</p></div></div>`
      }
    ];
    const root = document.getElementById("variants");
    const tpl = document.getElementById("paper-tpl");
    for (const v of variants) {
      const h = document.createElement("h2");
      h.className = "variant-h";
      h.textContent = v.title;
      root.appendChild(h);
      const node = tpl.content.cloneNode(true);
      node.querySelector(".article-slot").outerHTML = v.html;
      root.appendChild(node);
    }
  </script>
</body>
</html>
