<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>号外プレビュー — トレーナー帯の比較</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@600;700&family=M+PLUS+1p:wght@400;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --green: #6fbf2a;
      --green-dark: #4a9a18;
      --orange: #ff9900;
      --paper: #f7f7f4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "M PLUS 1p", "Hiragino Sans", sans-serif;
      background: #2a3038;
      color: #1a1a1a;
    }
    .stage {
      max-width: 26rem;
      margin: 0 auto;
      padding: 1rem 0.8rem 3rem;
    }
    .note {
      color: #9aa4b0;
      font-size: 0.78rem;
      line-height: 1.5;
      margin: 0 0 0.75rem;
    }
    .variant-h {
      color: #c9d4de;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      margin: 1.7rem 0 0.45rem;
    }
    .variant-h:first-of-type { margin-top: 0.35rem; }
    .paper {
      background: var(--paper);
      border-radius: 3px;
      overflow: hidden;
      box-shadow: 0 14px 48px rgba(0,0,0,.45);
    }
    .masthead {
      background:
        repeating-linear-gradient(-45deg,
          rgba(255,255,255,.13) 0 7px,
          transparent 7px 14px),
        linear-gradient(180deg, var(--green), var(--green-dark));
      color: #fff;
      text-align: center;
      font-weight: 800;
      font-size: 0.92rem;
      letter-spacing: 0.14em;
      padding: 0.5rem 0.6rem;
      text-shadow: 0 1px 0 rgba(0,0,0,.18);
    }
    .cover {
      position: relative;
      --cover-h: 20rem;
      --cover-pad-y: 0.6rem;
      --cover-inner-h: calc(var(--cover-h) - 2 * var(--cover-pad-y));
      height: var(--cover-h);
      overflow: hidden;
      background: #bcd4e0;
    }
    .cover-bg {
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 85%;
      height: 100%;
      object-fit: cover;
      object-position: center 40%;
    }
    .cover-blue {
      position: absolute;
      top: 0; right: 0; bottom: 0;
      width: 15%;
      background: #4a22e1;
      z-index: 1;
    }
    .cover-stand {
      position: absolute;
      left: -4%;
      bottom: -6%;
      height: 106%;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,.35));
      z-index: 2;
    }
    .cover-titles {
      position: absolute;
      right: 0; top: 0; bottom: 0;
      width: 36%;
      display: flex;
      flex-direction: row;
      direction: rtl;
      justify-content: flex-start;
      align-items: flex-start;
      gap: 0.35rem;
      padding: var(--cover-pad-y) 0.35rem;
      overflow: hidden;
      z-index: 3;
      pointer-events: none;
    }
    .cover-titles > * { direction: ltr; }
    .cover-titles .sub-img-wrap {
      height: calc(var(--cover-inner-h) * 7 / 9);
      width: 1.55rem;
      overflow: hidden;
      flex-shrink: 0;
    }
    .cover-titles .sub-img-wrap img {
      display: block;
      width: 100%;
      height: calc(100% * 4 / 3);
      object-fit: fill;
      object-position: top center;
      mix-blend-mode: screen;
    }
    .cover-titles .col-text {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-family: "M PLUS 1p", "Hiragino Sans", sans-serif;
      font-weight: 900;
      font-size: calc(var(--cover-inner-h) / 9);
      line-height: 1;
      color: #e31b23;
      -webkit-text-stroke: 0.07em #ffe44a;
      paint-order: stroke fill;
    }
    .article {
      padding: 0.45rem 0.5rem 0.5rem;
      background: #e8f3ea;
    }
    .article .inner {
      margin: 0;
      padding: 0.6rem 0.7rem 0.65rem;
      background: #fff;
      border: 2px solid #d7e6cc;
      box-shadow: 0 2px 0 rgba(74,154,24,.15);
      color: #1a1a1a;
      font-family: "IBM Plex Sans JP", "Hiragino Sans", sans-serif;
      font-size: 0.92rem;
      font-weight: 700;
      line-height: 1.75;
      letter-spacing: 0.02em;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: auto;
    }
    .article .lead { color: var(--orange); font-weight: 700; }

    /* ---- トレーナー帯 共通部品 ---- */
    .face {
      position: relative;
      flex-shrink: 0;
    }
    .face img {
      display: block;
      width: 3.1rem;
      height: 3.1rem;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #fff;
      background: #111;
    }
    .face .no {
      position: absolute;
      right: -0.12rem;
      bottom: -0.08rem;
      display: grid;
      place-items: center;
      width: 1.1rem;
      height: 1.1rem;
      border-radius: 50%;
      background: var(--green);
      color: #fff;
      font-size: 0.58rem;
      font-weight: 800;
      box-shadow: 0 0 0 2px #fff;
    }
    .who {
      margin: 0;
      font-family: "M PLUS 1p", "Hiragino Sans", sans-serif;
      font-weight: 800;
      line-height: 1.15;
    }
    .uma { margin: 0; font-weight: 700; }
    .win {
      display: inline-block;
      padding: 0.04rem 0.32rem;
      background: var(--orange);
      color: #fff;
      font-size: 0.55rem;
      font-weight: 800;
      letter-spacing: 0.12em;
    }

    /* A: 勝利者会見場。メインの芝とは別画像。下だけグラデ */
    .tb-a {
      position: relative;
      height: 5.35rem;
      overflow: hidden;
      font-family: "IBM Plex Sans JP", "Hiragino Sans", sans-serif;
    }
    .tb-a .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 58%;
    }
    .tb-a::after {
      content: "";
      position: absolute;
      inset: 22% 0 0;
      background: linear-gradient(transparent, rgba(8,16,28,.82));
    }
    .tb-a .row {
      position: absolute;
      z-index: 1;
      left: 0.55rem;
      right: 0.5rem;
      bottom: 0.4rem;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 0.5rem 0.55rem;
      color: #fff;
      text-shadow: 0 1px 4px rgba(0,0,0,.5);
    }
    .tb-a .who { font-size: 1.05rem; }
    .tb-a .uma { font-size: 0.68rem; opacity: .95; margin-top: 0.08rem; }
    .tb-a .specs {
      display: grid;
      grid-template-columns: 7.2rem 7.2rem;
      gap: 0.18rem 0.7rem;
      margin: 0;
      padding-left: 0.7rem;
      border-left: 1px solid rgba(255,255,255,.35);
    }
    .tb-a .specs dt {
      margin: 0;
      font-size: 0.5rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      opacity: .78;
    }
    .tb-a .specs dd {
      margin: 0.04rem 0 0;
      font-size: 0.68rem;
      font-weight: 700;
      line-height: 1.2;
    }

    /* D: 新聞欄外。左=人物、右=2×2のスペック */
    .tb-d {
      font-family: "IBM Plex Sans JP", "Hiragino Sans", sans-serif;
      background: #f4f1e8;
      border-top: 3px solid #1a1a1a;
    }
    .tb-d .rule {
      height: 4px;
      background: repeating-linear-gradient(
        90deg,
        var(--orange) 0 10px,
        #fff 10px 14px,
        var(--green) 14px 24px,
        #fff 24px 28px
      );
    }
    .tb-d .row {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 0.5rem 0.55rem;
      padding: 0.42rem 0.55rem 0.48rem;
    }
    .tb-d .face img { border-color: #1a1a1a; }
    .tb-d .who { font-size: 1.02rem; color: #111; }
    .tb-d .uma { font-size: 0.66rem; color: #444; margin-top: 0.08rem; }
    .tb-d .specs {
      display: grid;
      grid-template-columns: 6.6rem 7.4rem;
      gap: 0.22rem 0.85rem;
      margin: 0;
      padding-left: 0.75rem;
      border-left: 1px solid #c9c1aa;
    }
    .tb-d .specs dt {
      margin: 0;
      color: #7a7364;
      font-size: 0.5rem;
      font-weight: 700;
      letter-spacing: 0.12em;
    }
    .tb-d .specs dd {
      margin: 0.04rem 0 0;
      color: #1a1a1a;
      font-size: 0.7rem;
      font-weight: 800;
      line-height: 1.2;
    }
  </style>
</head>
<body>
  <div class="stage">
    <p class="note">
      トレーナー帯は A（会見場）と D（欄外の段組み直し）の2案。B・Cは見送り。
    </p>
    <div id="variants"></div>
  </div>

  <template id="paper-tpl">
    <article class="paper">
      <header class="masthead">月刊トゥインクル　号外</header>
      <div class="cover">
        <img class="cover-bg" src="../../../public/twinkle/frames/gogai_bg.png" alt="">
        <img class="cover-stand" src="stand-preview.png" alt="スペシャルウィーク">
        <div class="cover-blue" aria-hidden="true"></div>
        <div class="cover-titles">
          <div class="sub-img-wrap">
            <img src="../../../public/twinkle/subtitles/324.png" alt="">
          </div>
          <span class="col-text">スペシャルウィーク</span>
          <span class="col-text">見事チャンピオンに</span>
        </div>
      </div>
      <div class="article">
        <p class="inner">
          <span class="lead">プレビュー杯</span>
          本戦！並みいる猛者を退け勝ったのは
          <span class="lead">スペシャルウィーク</span>！
          <span class="lead">「プレビュー太郎」</span>
          との信頼が生んだ最高の結末だ。
          優勝に相応しい、素晴らしい走りを見せてくれた。
          こんな走りを見られたことに、ただただ感謝したい。
        </p>
      </div>
      <div class="band-slot"></div>
    </article>
  </template>

  <script>
    const face = `
      <div class="face">
        <img src="trainer-icon.png" alt="">
        <span class="no">1</span>
      </div>`;
    const specs = `
      <dl class="specs">
        <div><dt>開催</dt><dd>プレビュー杯</dd></div>
        <div><dt>コース</dt><dd>東京 2400m（芝）</dd></div>
        <div><dt>天候・バ場</dt><dd>晴・良</dd></div>
        <div><dt>頭数</dt><dd>8頭</dd></div>
      </dl>`;
    const variants = [
      {
        title: "A. 勝利者会見場キャプション",
        html: `
          <section class="tb-a" aria-label="優勝者と開催条件">
            <img class="bg" src="../../../public/twinkle/frames/gogai_press.png" alt="">
            <div class="row">
              ${face}
              <div>
                <span class="win">優勝</span>
                <p class="who">プレビュー太郎</p>
                <p class="uma">スペシャルウィーク　逃げ</p>
              </div>
              ${specs}
            </div>
          </section>`
      },
      {
        title: "D. 新聞欄外（段組み）",
        html: `
          <section class="tb-d" aria-label="優勝者と開催条件">
            <div class="rule"></div>
            <div class="row">
              ${face}
              <div>
                <span class="win">優勝</span>
                <p class="who">プレビュー太郎</p>
                <p class="uma">スペシャルウィーク　逃げ</p>
              </div>
              ${specs}
            </div>
          </section>`
      }
    ];
    const root = document.getElementById("variants");
    const tpl = document.getElementById("paper-tpl");
    for (const v of variants) {
      const h = document.createElement("h2");
      h.className = "variant-h";
      h.textContent = v.title;
      root.appendChild(h);
      const node = tpl.content.cloneNode(true);
      node.querySelector(".band-slot").outerHTML = v.html;
      root.appendChild(node);
    }
  </script>
</body>
</html>
