<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>号外プレビュー — トレーナー帯の比較</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@600;700&family=M+PLUS+1p:wght@400;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --green: #6fbf2a;
      --green-dark: #4a9a18;
      --orange: #ff9900;
      --paper: #f7f7f4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "M PLUS 1p", "Hiragino Sans", sans-serif;
      background: #2a3038;
      color: #1a1a1a;
    }
    .stage {
      max-width: 26rem;
      margin: 0 auto;
      padding: 1rem 0.8rem 3rem;
    }
    .note {
      color: #9aa4b0;
      font-size: 0.78rem;
      line-height: 1.5;
      margin: 0 0 0.75rem;
    }

    .paper {
      background: var(--paper);
      border-radius: 3px;
      overflow: hidden;
      box-shadow: 0 14px 48px rgba(0,0,0,.45);
    }
    .masthead {
      background:
        repeating-linear-gradient(-45deg,
          rgba(255,255,255,.13) 0 7px,
          transparent 7px 14px),
        linear-gradient(180deg, var(--green), var(--green-dark));
      color: #fff;
      text-align: center;
      font-weight: 800;
      font-size: 0.92rem;
      letter-spacing: 0.14em;
      padding: 0.5rem 0.6rem;
      text-shadow: 0 1px 0 rgba(0,0,0,.18);
    }
    .cover {
      position: relative;
      --cover-h: 20rem;
      --cover-pad-y: 0.6rem;
      --cover-inner-h: calc(var(--cover-h) - 2 * var(--cover-pad-y));
      height: var(--cover-h);
      overflow: hidden;
      background: #bcd4e0;
    }
    .cover-bg {
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 85%;
      height: 100%;
      object-fit: cover;
      object-position: center 40%;
    }
    .cover-blue {
      position: absolute;
      top: 0; right: 0; bottom: 0;
      width: 15%;
      background: #4a22e1;
      z-index: 1;
    }
    .cover-stand {
      position: absolute;
      left: -4%;
      bottom: -6%;
      height: 106%;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,.35));
      z-index: 2;
    }
    .cover-titles {
      position: absolute;
      right: 0; top: 0; bottom: 0;
      width: 36%;
      display: flex;
      flex-direction: row;
      direction: rtl;
      justify-content: flex-start;
      align-items: flex-start;
      gap: 0.35rem;
      padding: var(--cover-pad-y) 0.35rem;
      overflow: hidden;
      z-index: 3;
      pointer-events: none;
    }
    .cover-titles > * { direction: ltr; }
    .cover-titles .sub-img-wrap {
      height: calc(var(--cover-inner-h) * 7 / 9);
      width: 1.55rem;
      overflow: hidden;
      flex-shrink: 0;
    }
    .cover-titles .sub-img-wrap img {
      display: block;
      width: 100%;
      height: calc(100% * 4 / 3);
      object-fit: fill;
      object-position: top center;
      mix-blend-mode: screen;
    }
    .cover-titles .col-text {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-family: "M PLUS 1p", "Hiragino Sans", sans-serif;
      font-weight: 900;
      font-size: calc(var(--cover-inner-h) / 9);
      line-height: 1;
      color: #e31b23;
      -webkit-text-stroke: 0.07em #ffe44a;
      paint-order: stroke fill;
    }
    .article {
      padding: 0.45rem 0.5rem 0.5rem;
      background: #e8f3ea;
    }
    .article .inner {
      margin: 0;
      padding: 0.6rem 0.7rem 0.65rem;
      background: #fff;
      border: 2px solid #d7e6cc;
      box-shadow: 0 2px 0 rgba(74,154,24,.15);
      color: #1a1a1a;
      font-family: "IBM Plex Sans JP", "Hiragino Sans", sans-serif;
      font-size: 0.92rem;
      font-weight: 700;
      line-height: 1.75;
      letter-spacing: 0.02em;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: auto;
    }
    .article .lead { color: var(--orange); font-weight: 700; }

    /*
      トレーナー帯（D）: 一段。左＝人物（現状どおり）、右＝開催4値（ラベルなし）。
      右の4値はウマ娘行と同じ 0.78rem / 700、余白は格子で揃える。
    */
    .trainer {
      font-family: "IBM Plex Sans JP", "Hiragino Sans", sans-serif;
      background: #f4f1e8;
      border-top: 3px solid #1a1a1a;
    }
    .trainer .rule {
      height: 4px;
      background: repeating-linear-gradient(
        90deg,
        var(--orange) 0 10px,
        #fff 10px 14px,
        var(--green) 14px 24px,
        #fff 24px 28px
      );
    }
    .who-row {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.5rem 0.65rem 0.45rem;
    }
    .face {
      position: relative;
      flex-shrink: 0;
    }
    .face img {
      display: block;
      width: 3.15rem;
      height: 3.15rem;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #1a1a1a;
      background: #111;
    }
    .face .no {
      position: absolute;
      right: -0.12rem;
      bottom: -0.08rem;
      display: grid;
      place-items: center;
      width: 1.15rem;
      height: 1.15rem;
      border-radius: 50%;
      background: var(--green);
      color: #fff;
      font-size: 0.6rem;
      font-weight: 800;
      box-shadow: 0 0 0 2px #f4f1e8;
    }
    .who-copy {
      flex: 1 1 7.5rem;
      min-width: 0;
    }
    .win {
      display: inline-block;
      margin: 0 0 0.12rem;
      padding: 0.04rem 0.35rem;
      background: var(--orange);
      color: #fff;
      font-size: 0.58rem;
      font-weight: 800;
      letter-spacing: 0.14em;
    }
    .who {
      margin: 0;
      color: #111;
      font-family: "M PLUS 1p", "Hiragino Sans", sans-serif;
      font-size: 1.15rem;
      font-weight: 800;
      line-height: 1.15;
    }
    .uma {
      margin: 0.1rem 0 0;
      color: #444;
      font-size: 0.78rem;
      font-weight: 700;
    }
    .facts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      align-content: center;
      column-gap: 0.6rem;
      row-gap: 0.2rem;
      flex: 1 1 8.5rem;
      min-width: 0;
      margin: 0;
      padding: 0 0 0 0.6rem;
      border-left: 1px solid #d4ccb4;
      list-style: none;
      color: #333;
      font-size: 0.78rem;
      font-weight: 700;
      line-height: 1.35;
    }
    .facts li {
      margin: 0;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <div class="stage">
    <p class="note">
      号外プレビュー。トレーナー帯は一段。左が人物、右が開催4値（ラベルなし）。
    </p>
    <article class="paper">
      <header class="masthead">月刊トゥインクル　号外</header>
      <div class="cover">
        <img class="cover-bg" src="../../../public/twinkle/frames/gogai_bg.png" alt="">
        <img class="cover-stand" src="stand-preview.png" alt="スペシャルウィーク">
        <div class="cover-blue" aria-hidden="true"></div>
        <div class="cover-titles">
          <div class="sub-img-wrap">
            <img src="../../../public/twinkle/subtitles/324.png" alt="">
          </div>
          <span class="col-text">スペシャルウィーク</span>
          <span class="col-text">見事チャンピオンに</span>
        </div>
      </div>
      <div class="article">
        <p class="inner">
          <span class="lead">プレビュー杯</span>
          本戦！並みいる猛者を退け勝ったのは
          <span class="lead">スペシャルウィーク</span>！
          <span class="lead">「プレビュー太郎」</span>
          との信頼が生んだ最高の結末だ。
          優勝に相応しい、素晴らしい走りを見せてくれた。
          こんな走りを見られたことに、ただただ感謝したい。
        </p>
      </div>
      <section class="trainer" aria-label="優勝者と開催条件">
        <div class="rule"></div>
        <div class="who-row">
          <div class="face">
            <img src="trainer-icon.png" alt="">
            <span class="no">1</span>
          </div>
          <div class="who-copy">
            <span class="win">優勝</span>
            <p class="who">プレビュー太郎</p>
            <p class="uma">スペシャルウィーク　逃げ</p>
          </div>
          <ul class="facts">
            <li>プレビュー杯</li>
            <li>東京 2400m（芝）</li>
            <li>晴・良</li>
            <li>8頭</li>
          </ul>
        </div>
      </section>
    </article>
  </div>
</body>
</html>
