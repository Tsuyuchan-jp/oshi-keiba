<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>号外プレビュー v2 — oshi-keiba</title>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --green: #6fbf2a;
      --green-dark: #4a9a18;
      --orange: #ff9900;
      --paper: #f7f7f4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "M PLUS 1p", "Hiragino Sans", sans-serif;
      background: #2a3038;
      color: #1a1a1a;
    }

    /* ---- ステージ ---- */
    .stage {
      max-width: 26rem;
      margin: 0 auto;
      padding: 1rem 0.8rem 3rem;
    }
    .note {
      color: #9aa4b0;
      font-size: 0.78rem;
      line-height: 1.5;
      margin: 0 0 0.75rem;
    }

    /* ---- 紙面 ---- */
    .paper {
      background: var(--paper);
      border-radius: 3px;
      overflow: hidden;
      box-shadow: 0 14px 48px rgba(0,0,0,.45);
    }

    /* 1. マストヘッド */
    .masthead {
      background:
        repeating-linear-gradient(-45deg,
          rgba(255,255,255,.13) 0 7px,
          transparent 7px 14px),
        linear-gradient(180deg, var(--green), var(--green-dark));
      color: #fff;
      text-align: center;
      font-weight: 800;
      font-size: 0.92rem;
      letter-spacing: 0.14em;
      padding: 0.5rem 0.6rem;
      text-shadow: 0 1px 0 rgba(0,0,0,.18);
    }

    /* 2. カバー */
    .cover {
      position: relative;
      --cover-h: 20rem;
      --cover-pad-y: 0.6rem;
      --cover-inner-h: calc(var(--cover-h) - 2 * var(--cover-pad-y));
      height: var(--cover-h);
      overflow: hidden;
      background: #bcd4e0;
    }
    .cover-bg {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      /* 青帯（右15%）の裏に回さない。可視エリア 85% x 20rem */
      width: 85%;
      height: 100%;
      object-fit: cover;
      object-position: center 40%;
    }
    /* 青帯は狭く。左端は2列目の左寄り（3列目は帯の外に出す） */
    .cover-blue {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 15%;
      background: #4a22e1;
      z-index: 1;
    }
    /* 立ち絵を左へ寄せ、右の文言帯を空ける */
    .cover-stand {
      position: absolute;
      left: -4%;
      bottom: -6%;
      height: 106%;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,.35));
      z-index: 2;
    }
    /*
      上下の隙間はパディング（.cover の --cover-pad-y）。
      9文字サイズは内側の高さ÷9。はみ出した縁はここで切って、余白が潰れないようにする。
    */
    .cover-titles {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 36%;
      display: flex;
      flex-direction: row;
      direction: rtl;
      justify-content: flex-start;
      align-items: flex-start;
      gap: 0.35rem;
      padding: var(--cover-pad-y) 0.35rem;
      overflow: hidden;
      z-index: 3;
      pointer-events: none;
    }
    .cover-titles > * { direction: ltr; }
    .cover-titles .sub-img-wrap {
      height: calc(var(--cover-inner-h) * 7 / 9);
      width: 1.55rem;
      overflow: hidden;
      flex-shrink: 0;
    }
    .cover-titles .sub-img-wrap img {
      display: block;
      width: 100%;
      height: calc(100% * 4 / 3);
      object-fit: fill;
      object-position: top center;
      mix-blend-mode: screen;
    }
    .cover-titles .col-text {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-family: "M PLUS 1p", "Hiragino Sans", sans-serif;
      font-weight: 900;
      font-size: calc(var(--cover-inner-h) / 9);
      line-height: 1;
      letter-spacing: 0;
      color: #e31b23;
      -webkit-text-stroke: 0.07em #ffe44a;
      paint-order: stroke fill;
    }

    /* 3. 本文（230 の4文を連結。<color=#ff9900> は .lead） */
    .article {
      padding: 0.8rem 0.85rem 0.9rem;
      background: #fff;
      font-size: 0.86rem;
      line-height: 1.72;
    }
    .article .lead { color: var(--orange); font-weight: 800; }

    /*
      4. トレーナー帯
      zokan_page1_bg.png は 1024×512。縦を 3/4 に潰すと表示比 1024:(512×0.75) = 8:3。
      中のアイコン等の中身は未確定。仮置き。
    */
    .trainer {
      position: relative;
      aspect-ratio: 8 / 3;
      overflow: hidden;
    }
    .trainer-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
    }
    .trainer-inner {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.55rem 0.85rem;
    }
    .trainer-inner img {
      width: 3.4rem;
      height: 3.4rem;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #fff;
      background: #111;
      box-shadow: 0 1px 6px rgba(0,0,0,.25);
      flex-shrink: 0;
    }
    .trainer .role { font-size: 0.62rem; font-weight: 700; color: #1a4a78; letter-spacing: .08em; }
    .trainer .who  { font-size: 1.15rem; font-weight: 800; line-height: 1.2; margin: 0.08rem 0 0.12rem; color: #122; }
    .trainer .uma  { font-size: 0.74rem; color: #334; }
  </style>
</head>
<body>
  <div class="stage">
    <p class="note">
      号外プレビュー。メイン下は本文（230 改変4文）→トレーナー帯（zokan_page1_bg を縦 3/4）。2着・3着枠なし。
    </p>
    <article class="paper">

      <!-- 1. マストヘッド -->
      <header class="masthead">月刊トゥインクル　号外</header>

      <!-- 2. カバー -->
      <div class="cover">
        <!-- gogai_bg.png: ゴール付近の芝＋紙吹雪（アニメ調・採用） -->
        <img class="cover-bg"
          src="../../../public/twinkle/frames/gogai_bg.png"
          alt="">

        <!-- 立ち絵を左へ寄せている -->
        <img class="cover-stand"
          src="stand-preview.png"
          alt="スペシャルウィーク">

        <!-- 右側の青塗り帯 -->
        <div class="cover-blue" aria-hidden="true"></div>

        <!--
          縦書き3列（右→左、上端揃え）
          1. 324.png
          2. CSV 571 の \n より前（ウマ娘名）
          3. \n より後（見事チャンピオンに）
        -->
        <div class="cover-titles">
          <div class="sub-img-wrap">
            <img src="../../../public/twinkle/subtitles/324.png" alt="鮮やかな勝利！">
          </div>
          <span class="col-text">スペシャルウィーク</span>
          <span class="col-text">見事チャンピオンに</span>
        </div>
      </div>

      <!-- 3. 本文（230 改変: 33001 + 100202 + 110200 + 120201 を連結） -->
      <div class="article">
        <span class="lead">プレビュー杯</span>
        本戦！並みいる猛者を退け勝ったのは
        <span class="lead">スペシャルウィーク</span>！
        <span class="lead">「プレビュー太郎」</span>
        との信頼が生んだ最高の結末だ。
        優勝に相応しい、素晴らしい走りを見せてくれた。
        こんな走りを見られたことに、ただただ感謝したい。
      </div>

      <!-- 4. トレーナー帯（中身は後で詰める。仮置き） -->
      <section class="trainer" aria-label="1着トレーナー">
        <img class="trainer-bg"
          src="../../../public/twinkle/frames/zokan_page1_bg.png"
          alt="">
        <div class="trainer-inner">
          <img src="trainer-icon.png" alt="">
          <div>
            <div class="role">出走者</div>
            <p class="who">プレビュー太郎</p>
            <div class="uma">1番　スペシャルウィーク</div>
          </div>
        </div>
      </section>

    </article>
  </div>
</body>
</html>
