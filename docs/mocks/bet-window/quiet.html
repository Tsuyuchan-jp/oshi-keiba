<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>窓口 — 静かな窓口</title>
  <link rel="stylesheet" href="./bet-shared.css">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="tone-quiet">
  <div class="scene">
    <div class="scene-bg"></div>
    <div class="app-shell">
      <header class="chrome">
        <div>
          <a class="brand" href="./index.html">OSHI KEIBA</a>
          <div class="who">neko · 12,800 スペ</div>
        </div>
        <div class="nav">
          <span class="pill"><span class="dot"></span>投票中</span>
          <a href="../venue-board/layout-venue.html">場内</a>
          <a class="on" href="./index.html">窓口</a>
        </div>
      </header>
      <div class="desk">
        <h1>発売所</h1>
        <div class="bal"><span>いまの所持</span><strong>12,800 スペ</strong></div>
        <div class="tabs">
          <a class="on" href="#">単勝</a>
          <a href="#">馬連</a>
          <a href="#">馬単</a>
          <a href="#">3連複</a>
          <a href="#">3連単</a>
        </div>
        <div class="row">
          <label>1着
            <select><option>1 サイレンススズカ</option><option>2 スペシャルウィーク</option></select>
          </label>
        </div>
        <div class="row">
          <button type="button" class="amt">+100</button>
          <button type="button" class="amt">+500</button>
          <button type="button" class="amt">残り全部</button>
          <label>金額（スペ）<input type="number" value="100"></label>
          <button type="button" class="buy">買う</button>
        </div>
        <p class="note">買う前に確認が出ます。締切までやりなおしできます。</p>
        <div class="odds-mini">
          <h2>単勝の目安（小さく）</h2>
          <div class="orow"><span>1</span><span>サイレンススズカ</span><b>3.2</b></div>
          <div class="orow"><span>2</span><span>スペシャルウィーク</span><b>5.8</b></div>
          <div class="orow"><span>3</span><span>グラスワンダー</span><b>8.1</b></div>
        </div>
        <div class="mine">
          <h2>自分の馬券</h2>
          <div class="mine-row"><span>単勝 1 サイレンススズカ</span><span>200</span></div>
          <div class="mine-row"><span>馬連 1-3</span><span>100</span></div>
          <button type="button" class="text-btn">やりなおし（全部取消）</button>
        </div>
      </div>
    </div>
  </div>
  <div class="mock-label">案A · 静かな窓口</div>
</body>
</html>
