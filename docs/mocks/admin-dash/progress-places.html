<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理 · 進行</title>
  <link rel="stylesheet" href="./shared.css">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    .slots-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(14.5rem, 1fr));
      gap: .55rem;
    }
    .pool {
      display: flex;
      flex-wrap: wrap;
      gap: .4rem;
      margin-bottom: .75rem;
      min-height: 2.8rem;
    }
    .pool .horse { width: min(16rem, 100%); }
    .split {
      display: grid;
      grid-template-columns: minmax(11.5rem, 0.85fr) minmax(0, 1.7fr);
      gap: 1rem;
      min-height: 18rem;
    }
    .split .pool.stack {
      flex-wrap: nowrap;
      margin-bottom: 0;
    }
    .split .pool .horse { width: 100%; }
    .ranks-cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-auto-flow: column;
      gap: .4rem .65rem;
    }
    .col-h {
      font-size: .72rem;
      letter-spacing: .08em;
      font-weight: 700;
      color: #6b7380;
      margin: 0 0 .4rem;
    }
    .stack { display: flex; flex-direction: column; gap: .4rem; }
    .rank-row {
      display: grid;
      grid-template-columns: 2.6rem minmax(0, 1fr);
      gap: .4rem;
      align-items: stretch;
    }
    .rank-row .rk-n {
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: #2b6cb0;
      background: #f4f6f9;
      border-radius: 6px;
      font-size: .92rem;
    }
    .rank-row .slot { min-height: 2.7rem; }
    @media (max-width: 899px) {
      .split { grid-template-columns: 1fr; }
      .ranks-cols { grid-template-columns: 1fr; grid-auto-flow: row; }
    }
  </style>
</head>
<body data-phase="voting">
  <div class="dash">
    <nav class="side" aria-label="管理">
      <div class="mark">OSHI KEIBA · 管理</div>
      <a href="./progress-places.html">進行</a>
      <a class="ghost" href="#">出走登録</a>
      <a href="./horses.html">出走</a>
      <a href="./ledger.html">台帳</a>
      <a class="ghost" href="#">オッズ</a>
      <a class="ghost" href="#">開催設定</a>
    </nav>
    <div class="main">
      <section class="hero">
        <div class="hero-top">
          <h1>第2回 本番</h1>
          <span class="phase" id="phase-pill">投票中</span>
        </div>
        <div class="kpis">
          <div class="kpi"><span class="k">頭数</span><span class="v" id="kpi-n">16</span></div>
          <div class="kpi"><span class="k">締切</span><span class="v" id="kpi-close">18:40 JST</span></div>
          <div class="kpi"><span class="k">参加者</span><span class="v" id="kpi-mem">12</span></div>
          <div class="kpi"><span class="k">票</span><span class="v" id="kpi-bets">47</span></div>
        </div>
        <div class="ops-pair">
          <div>
            <div class="ops-k">いまのフェーズ</div>
            <span class="phase" id="ops-pill">投票中</span>
          </div>
          <div>
            <div class="ops-k">次に必要な操作</div>
            <p class="ops-next" id="ops-next"></p>
          </div>
        </div>
        <div class="ctas">
          <button type="button" id="btn-open">投票開始</button>
          <button type="button" class="danger" id="btn-close">強制締切</button>
          <button type="button" id="btn-next">次の開催を開く</button>
        </div>
      </section>
      <section class="work" id="work"></section>
    </div>
  </div>
  <div class="phase-bar" role="group" aria-label="開催の面">
    <button type="button" data-phase="setup">出走登録中</button>
    <button type="button" data-phase="voting">投票中</button>
    <button type="button" data-phase="closed">締切</button>
    <button type="button" data-phase="published">結果公開</button>
  </div>
  <div class="compare-bar" role="group" aria-label="着順の案">
    <button type="button" data-layout="split">案3 採用</button>
    <button type="button" data-layout="slots">案2 不採用</button>
  </div>
  <div class="mock-label">管理モック · 進行 · 本番未適用</div>
  <script>
    const HORSES = [
      [1, "サイレンススズカ", "neko", "3.2", 18.4, false],
      [2, "スペシャルウィーク", "aki", "5.8", 12.1, false],
      [3, "グラスワンダー", "yuu", "8.1", 9.6, true],
      [4, "セイウンスカイ", "ken", "12.4", 7.2, false],
      [5, "エルコンドルパサー", "mai", "6.0", 11.8, false],
      [6, "テイエムオペラオー", "rio", "15.2", 6.4, false],
      [7, "ファインモーション", "sora", "9.7", 8.5, false],
      [8, "ナリタブライアン", "haru", "18.0", 5.9, true],
      [9, "メジロマックイーン", "nao", "7.4", 10.2, false],
      [10, "トウカイテイオー", "kei", "11.1", 7.8, false],
      [11, "ビワハヤヒデ", "jun", "22.6", 4.8, false],
      [12, "ミホノブルボン", "ren", "14.3", 6.7, false],
      [13, "サクラバクシンオー", "aya", "16.8", 6.1, false],
      [14, "タイキシャトル", "mika", "10.5", 8.0, false],
      [15, "エアグルーヴ", "shin", "13.9", 6.9, false],
      [16, "シンボリルドルフ", "taka", "4.6", 14.0, false],
    ];
    const RECENT = [
      ["aki", "単勝 1", "200"],
      ["neko", "馬連 1-16", "100"],
      ["mai", "単勝 16", "300"],
      ["yuu", "3連複 1-2-16", "100"],
      ["ken", "馬単 16→1", "100"],
      ["sora", "単勝 5", "200"],
    ];
    const FINISH = [1, 16, 2, 5, 9, 14, 7, 3, 15, 10, 12, 4, 6, 13, 8, 11];
    const N = HORSES.length;
    let phase = "voting";
    let layout = "split";
    let places = Array(N).fill(null);
    let pick = null;
    let saved = false;

    function horseByN(n) { return HORSES.find((h) => h[0] === n); }
    function used() { return new Set(places.filter((x) => x != null)); }
    function nextHole() { return places.findIndex((x) => x == null); }

    function setPlace(i, n) {
      const prev = places.indexOf(n);
      if (prev >= 0) places[prev] = null;
      places[i] = n;
      pick = null;
      saved = false;
      paint();
    }
    function clearPlace(i) {
      places[i] = null;
      pick = null;
      saved = false;
      paint();
    }
    function assignNext(n) {
      if (used().has(n)) {
        clearPlace(places.indexOf(n));
        return;
      }
      const hole = nextHole();
      if (hole >= 0) setPlace(hole, n);
    }

    function horseEl(n, extraClass) {
      const h = horseByN(n);
      const on = pick === n ? " on" : "";
      const st = extraClass ? " " + extraClass : "";
      const drag = extraClass === "static" ? "" : ` draggable="true"`;
      return `<div class="horse${on}${st}"${drag} data-n="${n}">
        <span class="n">${n}</span>
        <span class="uma">${h[1]}</span>
        <span class="run">${h[2]}</span>
      </div>`;
    }

    function ranksHtml(readonly) {
      const mid = Math.ceil(N / 2);
      const idle = HORSES.map((h) => h[0]).filter((n) => !used().has(n));
      const left = readonly
        ? ""
        : `<div>
            <p class="col-h">未着順</p>
            <div class="stack pool" data-pool="1">${idle.map((n) => horseEl(n)).join("") || `<span class="note">なし</span>`}</div>
          </div>`;
      return `<div class="split"${readonly ? ` style="grid-template-columns:1fr"` : ""}>
        ${left}
        <div>
          <p class="col-h">${readonly ? "確定着順" : "着順"}</p>
          <div class="ranks-cols" style="grid-template-rows: repeat(${mid}, auto)">${places.map((n, i) =>
            `<div class="rank-row">
              <div class="rk-n">${i + 1}着</div>
              <div class="slot${n ? " fill" : ""}" data-slot="${i}">
                ${n ? horseEl(n, readonly ? "static" : "") : (readonly ? "" : `<span class="note">ここに置く</span>`)}
              </div>
            </div>`
          ).join("")}</div>
        </div>
      </div>`;
    }

    function slotsHtml() {
      const idle = HORSES.map((h) => h[0]).filter((n) => !used().has(n));
      return `<div class="pool" data-pool="1">${idle.map((n) => horseEl(n)).join("") || `<span class="note">全部入りました</span>`}</div>` +
        `<div class="slots-grid">${places.map((n, i) =>
          `<div class="slot${n ? " fill" : ""}" data-slot="${i}">
            <div class="rk">${i + 1}着</div>
            ${n ? horseEl(n) : `<span class="note">ドロップまたはタップ</span>`}
          </div>`
        ).join("")}</div>`;
    }

    function miniWin() {
      const mid = Math.ceil(N / 2);
      const rows = HORSES.map(([n, uma, run, od]) =>
        `<div class="mini-row"><span class="n">${n}</span><span class="uma">${uma}</span><span class="run">${run}</span><span class="od">${od}</span></div>`
      ).join("");
      return `<div class="mini-grid" style="grid-template-rows: repeat(${mid}, auto)">${rows}</div>`;
    }

    function paintHero() {
      const pills = [
        document.getElementById("phase-pill"),
        document.getElementById("ops-pill"),
      ];
      const next = document.getElementById("ops-next");
      for (const pill of pills) pill.classList.remove("live", "done");
      document.getElementById("kpi-n").textContent = String(N);
      document.getElementById("kpi-close").textContent = "18:40 JST";
      document.getElementById("kpi-mem").textContent = phase === "setup" ? "—" : "12";
      document.getElementById("kpi-bets").textContent = phase === "setup" ? "0" : "47";
      document.getElementById("btn-open").disabled = phase !== "setup";
      document.getElementById("btn-close").disabled = phase !== "voting";
      document.getElementById("btn-next").disabled = phase !== "published";
      let label = "";
      let nextHtml = "";
      if (phase === "setup") {
        label = "出走登録中";
        nextHtml = "出走を揃えてから「投票開始」。OCRと評価点は出走登録へ。";
      } else if (phase === "voting") {
        label = "投票中";
        nextHtml = "ゲーム内で着順が見える前に「強制締切」。";
        for (const pill of pills) pill.classList.add("live");
      } else if (phase === "closed") {
        label = "投票締切";
        nextHtml = "着順をすべて入れて保存し、問題なければ結果を公開して払戻する。";
      } else {
        label = "結果公開";
        nextHtml = "払戻は済んでいます。次のレースは「次の開催を開く」。";
        for (const pill of pills) pill.classList.add("done");
      }
      for (const pill of pills) pill.textContent = label;
      next.innerHTML = nextHtml;
      for (const b of document.querySelectorAll(".phase-bar [data-phase]")) {
        b.setAttribute("aria-pressed", b.dataset.phase === phase ? "true" : "false");
      }
    }

    function paintWork() {
      const work = document.getElementById("work");
      if (phase === "setup") {
        work.innerHTML = `<h2>出走の要約</h2>
          <p class="note">進行には名簿だけ。読取と直置きの編集は出走登録。</p>
          <table class="plain">
            <thead><tr><th>#</th><th>ウマ娘</th><th>出走者</th><th>評価点</th><th></th></tr></thead>
            <tbody>${HORSES.map(([n, uma, run, , sc, man]) =>
              `<tr><td class="n">${n}</td><td>${uma}</td><td>${run}</td><td>${sc.toFixed(1)}</td>
               <td>${man ? `<span class="tag warn">直置き</span>` : `<span class="tag">自動</span>`}</td></tr>`
            ).join("")}</tbody>
          </table>
          <p class="note">直置きが 2 頭。材料が揃えば自動に戻せます。</p>
          <button type="button" class="more-link" id="go-horses" style="border:0;background:none;cursor:pointer;padding:0">出走登録へ（モック未稿）</button>`;
        document.getElementById("go-horses").addEventListener("click", () => alert("モックです。出走登録タブは未稿。"));
        return;
      }
      if (phase === "voting") {
        work.innerHTML = `<h2>投票のいま</h2>
          <p class="note">単勝の参考（番号・ウマ娘・出走者・オッズ）と直近の票。連勝の板はオッズ、全文は台帳。</p>
          <div class="work-split">
            <div>
              <p class="col-h">単勝 · 参考</p>
              ${miniWin()}
              <a class="more-link" href="#">オッズタブへ（未稿）</a>
            </div>
            <div>
              <p class="col-h">直近の票</p>
              <div class="bet-mini">${RECENT.map(([w, lab, amt]) =>
                `<div class="t-row"><span class="who">${w}</span><span class="lab">${lab}</span><span>${amt}</span></div>`
              ).join("")}</div>
              <a class="more-link" href="#">台帳へ（未稿）</a>
            </div>
          </div>`;
        return;
      }
      if (phase === "published") {
        places = FINISH.slice();
        work.innerHTML = `<h2>結果</h2>
          <p class="note">払戻済み。着順は読み専用。次の開催は上段。</p>
          ${ranksHtml(true)}`;
        return;
      }
      const filled = places.every((x) => x != null);
      const note = layout === "slots"
        ? "案2（不採用）。上の未着順をクリックしてから枠を指定。"
        : "案3（採用）。左が未着順（1列）。右は上から折る2列。";
      work.innerHTML = `<h2>着順</h2>
        <p class="note">${note}</p>
        <div id="board">${layout === "slots" ? slotsHtml() : ranksHtml(false)}</div>
        <div class="work-actions">
          <button type="button" id="save">着順を保存</button>
          <button type="button" class="primary" id="pub"${filled && saved ? "" : " disabled"}>結果を公開して払戻する</button>
          <button type="button" id="reset">やりなおし</button>
        </div>`;
      bindBoard();
      document.getElementById("save").addEventListener("click", () => {
        if (places.some((x) => x == null)) {
          alert("まだ空の着順があります。");
          return;
        }
        saved = true;
        alert("モックです。本番では着順を保存し、一般にはまだ出しません。");
        paint();
      });
      document.getElementById("pub").addEventListener("click", () => {
        if (!confirm("結果を公開して払戻します。着順が一般に出ます。よろしいですか？")) return;
        alert("モックです。本番では公開と払戻です。");
        phase = "published";
        paint();
      });
      document.getElementById("reset").addEventListener("click", () => {
        places = Array(N).fill(null);
        pick = null;
        saved = false;
        paint();
      });
      for (const b of document.querySelectorAll(".compare-bar [data-layout]")) {
        b.setAttribute("aria-pressed", b.dataset.layout === layout ? "true" : "false");
      }
    }

    function bindBoard() {
      const board = document.getElementById("board");
      if (!board) return;
      board.querySelectorAll(".horse:not(.static)").forEach((el) => {
        el.addEventListener("click", (e) => {
          e.stopPropagation();
          const n = Number(el.dataset.n);
          const inSlot = el.closest("[data-slot]");
          if (inSlot) {
            clearPlace(Number(inSlot.dataset.slot));
            return;
          }
          if (layout === "split") {
            assignNext(n);
            return;
          }
          pick = pick === n ? null : n;
          paint();
        });
        el.addEventListener("dragstart", (e) => {
          e.dataTransfer.setData("text/plain", el.dataset.n);
          e.dataTransfer.effectAllowed = "move";
        });
      });
      board.querySelectorAll("[data-slot]").forEach((slot) => {
        slot.addEventListener("click", () => {
          const i = Number(slot.dataset.slot);
          if (pick != null) setPlace(i, pick);
        });
        slot.addEventListener("dragover", (e) => {
          e.preventDefault();
          slot.classList.add("drop");
        });
        slot.addEventListener("dragleave", () => slot.classList.remove("drop"));
        slot.addEventListener("drop", (e) => {
          e.preventDefault();
          slot.classList.remove("drop");
          const n = Number(e.dataTransfer.getData("text/plain"));
          if (n) setPlace(Number(slot.dataset.slot), n);
        });
      });
    }

    function paint() {
      document.body.dataset.phase = phase;
      paintHero();
      paintWork();
    }

    document.getElementById("btn-open").addEventListener("click", () => {
      if (!confirm("投票を開始します。このあと出走の追加はできません。よろしいですか？")) return;
      phase = "voting";
      paint();
    });
    document.getElementById("btn-close").addEventListener("click", () => {
      if (!confirm("強制締切します。投票を止め、確定配当に切り替えます。よろしいですか？")) return;
      phase = "closed";
      places = Array(N).fill(null);
      saved = false;
      paint();
    });
    document.getElementById("btn-next").addEventListener("click", () => {
      if (!confirm("次の開催を開きます。いまの結果は残し、新しい出走登録に入ります。よろしいですか？")) return;
      phase = "setup";
      places = Array(N).fill(null);
      saved = false;
      paint();
    });

    const pq = new URLSearchParams(location.search);
    if (["setup", "voting", "closed", "published"].includes(pq.get("phase"))) phase = pq.get("phase");
    if (pq.get("layout") === "slots" || pq.get("layout") === "split") layout = pq.get("layout");
    if (phase === "published") places = FINISH.slice();

    for (const b of document.querySelectorAll(".phase-bar [data-phase]")) {
      b.addEventListener("click", () => {
        phase = b.dataset.phase;
        if (phase === "published") places = FINISH.slice();
        if (phase === "closed") {
          places = Array(N).fill(null);
          saved = false;
        }
        const u = new URL(location.href);
        u.searchParams.set("phase", phase);
        history.replaceState(null, "", u);
        paint();
      });
    }
    for (const b of document.querySelectorAll(".compare-bar [data-layout]")) {
      b.addEventListener("click", () => {
        layout = b.dataset.layout;
        const u = new URL(location.href);
        u.searchParams.set("layout", layout);
        history.replaceState(null, "", u);
        paint();
      });
    }
    paint();
  </script>
</body>
</html>
