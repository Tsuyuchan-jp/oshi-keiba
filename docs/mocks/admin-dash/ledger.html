<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理 · 台帳</title>
  <link rel="stylesheet" href="./shared.css">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="dash">
    <nav class="side" aria-label="管理">
      <div class="mark">OSHI KEIBA · 管理</div>
      <a href="./progress-places.html">進行</a>
      <a class="ghost" href="#">出走登録</a>
      <a href="./horses.html">出走</a>
      <a class="on" href="./ledger.html">台帳</a>
      <a class="ghost" href="#">オッズ</a>
      <a class="ghost" href="#">開催設定</a>
    </nav>
    <div class="main">
      <section class="hero">
        <div class="hero-top">
          <h1>台帳</h1>
          <span class="phase live">投票中</span>
        </div>
        <p class="note" style="margin:.45rem 0 0;color:#5c6570;font-size:.85rem">左が口座、右が馬券。組み合わせの板はオッズ。公開前の結果・確定配当・収支は空。</p>
      </section>
      <div class="ledger-desk">
        <section class="work">
          <div class="work-head">
            <h2>残高</h2>
            <button type="button" class="secondary" id="del" style="border:1px solid #c5ccd6;background:#fff;padding:.28rem .55rem;border-radius:6px;cursor:pointer;font-size:.78rem">メンバー削除</button>
          </div>
          <table class="plain">
            <thead><tr><th>名前</th><th class="num">残高</th></tr></thead>
            <tbody id="bal"></tbody>
          </table>
        </section>
        <section class="work">
          <div class="work-head">
            <h2>全投票</h2>
            <p class="sort-links">
              <a href="#" id="ord-new" class="on">新しい順</a>
              ·
              <a href="#" id="ord-name">名前順</a>
            </p>
          </div>
          <table class="plain">
            <thead>
              <tr>
                <th>誰</th><th>賭式</th><th>組み合わせ</th>
                <th class="num">額</th><th>結果</th><th class="num">確定配当</th><th class="num">収支</th>
              </tr>
            </thead>
            <tbody id="bets"></tbody>
          </table>
        </section>
      </div>
    </div>
  </div>
  <div class="mock-label">管理モック · 台帳 · 本番未適用</div>
  <script>
    const MEMBERS = [
      ["aki", 12600], ["neko", 12800], ["mai", 12100], ["yuu", 12900],
      ["ken", 11800], ["sora", 12400], ["haru", 13000], ["nao", 12200],
      ["kei", 11500], ["jun", 12700], ["ren", 11900], ["taka", 12300],
    ];
    const BETS = [
      { t: 12, who: "aki", kind: "単勝", lab: "1 サイレンススズカ", amt: 200 },
      { t: 11, who: "neko", kind: "馬連", lab: "1-16", amt: 100 },
      { t: 10, who: "mai", kind: "単勝", lab: "16 シンボリルドルフ", amt: 300 },
      { t: 9, who: "yuu", kind: "3連複", lab: "1-2-16", amt: 100 },
      { t: 8, who: "ken", kind: "馬単", lab: "16→1", amt: 100 },
      { t: 7, who: "sora", kind: "単勝", lab: "5 エルコンドルパサー", amt: 200 },
      { t: 6, who: "neko", kind: "単勝", lab: "1 サイレンススズカ", amt: 200 },
      { t: 5, who: "haru", kind: "馬連", lab: "1-5", amt: 100 },
      { t: 4, who: "nao", kind: "3連単", lab: "1→16→2", amt: 100 },
      { t: 3, who: "taka", kind: "単勝", lab: "2 スペシャルウィーク", amt: 400 },
      { t: 2, who: "jun", kind: "馬単", lab: "1→2", amt: 100 },
      { t: 1, who: "ren", kind: "単勝", lab: "9 メジロマックイーン", amt: 100 },
    ];
    let order = "new";

    function yen(n) { return n.toLocaleString("ja-JP"); }

    function paintBal() {
      document.getElementById("bal").innerHTML = MEMBERS.map(([n, b]) =>
        `<tr><td>${n}</td><td class="num">${yen(b)}</td></tr>`
      ).join("");
    }

    function paintBets() {
      const rows = BETS.slice();
      if (order === "name") rows.sort((a, b) => a.who.localeCompare(b.who, "ja") || b.t - a.t);
      else rows.sort((a, b) => b.t - a.t);
      document.getElementById("bets").innerHTML = rows.map((b) =>
        `<tr>
          <td>${b.who}</td>
          <td>${b.kind}</td>
          <td>${b.lab}</td>
          <td class="num">${yen(b.amt)}</td>
          <td>—</td>
          <td class="num">—</td>
          <td class="num">—</td>
        </tr>`
      ).join("");
      document.getElementById("ord-new").classList.toggle("on", order === "new");
      document.getElementById("ord-name").classList.toggle("on", order === "name");
    }

    document.getElementById("ord-new").addEventListener("click", (e) => {
      e.preventDefault();
      order = "new";
      paintBets();
    });
    document.getElementById("ord-name").addEventListener("click", (e) => {
      e.preventDefault();
      order = "name";
      paintBets();
    });
    document.getElementById("del").addEventListener("click", () => {
      alert("モックです。本番では確認のうえ口座と票を消します。投票中は板が動きます。");
    });
    paintBal();
    paintBets();
  </script>
</body>
</html>
