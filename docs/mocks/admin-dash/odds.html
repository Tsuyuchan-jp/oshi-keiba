<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理 · オッズ</title>
  <link rel="stylesheet" href="./shared.css">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="odds-page">
  <div class="dash">
    <nav class="side" aria-label="管理">
      <div class="mark">OSHI KEIBA · 管理</div>
      <a href="./progress-places.html">進行</a>
      <a class="ghost" href="#">出走登録</a>
      <a href="./horses.html">出走</a>
      <a href="./ledger.html">台帳</a>
      <a class="on" href="./odds.html">オッズ</a>
      <a class="ghost" href="#">開催設定</a>
    </nav>
    <div class="main">
      <section class="hero odds-hero">
        <div class="hero-top">
          <h1>オッズ</h1>
          <span class="phase" id="phase-pill">投票中</span>
          <p class="sort-links">
            <a href="#" id="view-live" class="on">投票中</a>
            ·
            <a href="#" id="view-closed">締切後</a>
          </p>
        </div>
        <p class="note">5賭式を同時に出す。単勝は全頭、連勝は実票がある買い目だけ。複勝・枠連・ワイド、評価点・Seed は出さない。各枠内スクロール。</p>
      </section>
      <div class="odds-desk" id="desk"></div>
    </div>
  </div>
  <div class="mock-label">管理モック · オッズ · 本番未適用</div>
  <script>
    const WIN = [
      [1, "サイレンススズカ", "neko", "3.2", "3.2"],
      [2, "スペシャルウィーク", "aki", "5.8", "6.1"],
      [3, "グラスワンダー", "yuu", "8.1", "8.4"],
      [4, "セイウンスカイ", "ken", "12.4", "13.0"],
      [5, "エルコンドルパサー", "mai", "6.0", "6.2"],
      [6, "テイエムオペラオー", "rio", "15.2", "16.8"],
      [7, "ファインモーション", "sora", "9.7", "10.1"],
      [8, "ナリタブライアン", "haru", "18.0", "19.4"],
      [9, "メジロマックイーン", "nao", "7.4", "7.6"],
      [10, "トウカイテイオー", "kei", "11.1", "11.8"],
      [11, "ビワハヤヒデ", "jun", "22.6", "24.0"],
      [12, "ミホノブルボン", "ren", "14.3", "15.0"],
      [13, "サクラバクシンオー", "aya", "16.8", "17.5"],
      [14, "タイキシャトル", "mika", "10.5", "10.9"],
      [15, "エアグルーヴ", "shin", "13.9", "14.6"],
      [16, "シンボリルドルフ", "taka", "4.6", "4.8"],
    ];
    const BOARDS = [
      { id: "win", area: "win", label: "単勝", all: true, rows: WIN.map(([n, uma, run, ref, conf]) => ({ n, uma, run, ref, conf })) },
      { id: "quinella", area: "q", label: "馬連", rows: [
        { lab: "1 - 16", ref: "18.0", conf: "18.0" },
        { lab: "1 - 2", ref: "28.5", conf: "29.0" },
        { lab: "1 - 5", ref: "42.0", conf: "44.0" },
        { lab: "2 - 16", ref: "51.0", conf: "55.0" },
        { lab: "5 - 16", ref: "66.0", conf: "70.0" },
        { lab: "1 - 9", ref: "74.0", conf: "78.0" },
        { lab: "2 - 5", ref: "88.0", conf: "92.0" },
        { lab: "9 - 16", ref: "95.0", conf: "101" },
      ] },
      { id: "exacta", area: "e", label: "馬単", rows: [
        { lab: "1 → 16", ref: "32.4", conf: "32.4" },
        { lab: "16 → 1", ref: "48.0", conf: "51.0" },
        { lab: "1 → 2", ref: "41.0", conf: "43.0" },
        { lab: "1 → 5", ref: "58.0", conf: "61.0" },
        { lab: "2 → 1", ref: "72.0", conf: "76.0" },
        { lab: "16 → 2", ref: "84.0", conf: "90.0" },
      ] },
      { id: "trio", area: "t", label: "3連複", rows: [
        { lab: "1 - 2 - 16", ref: "54.0", conf: "54.0" },
        { lab: "1 - 5 - 16", ref: "88.0", conf: "94.0" },
        { lab: "1 - 2 - 5", ref: "102", conf: "110" },
        { lab: "1 - 5 - 9", ref: "120", conf: "128" },
      ] },
      { id: "trifecta", area: "f", label: "3連単", voidWhenClosed: true, rows: [
        { lab: "1 → 16 → 2", ref: "180", conf: "void" },
        { lab: "1 → 2 → 16", ref: "210", conf: "void" },
        { lab: "1 → 16 → 5", ref: "226", conf: "void" },
        { lab: "1 → 2 → 5", ref: "240", conf: "void" },
        { lab: "16 → 1 → 2", ref: "268", conf: "void" },
      ] },
    ];
    let live = true;

    function cell(v) {
      if (v === "void") return "特払い";
      if (v === "—") return "—";
      return v + "倍";
    }

    function tableWin(rows, col) {
      const body = rows.map((r) => {
        const v = live ? r.ref : r.conf;
        return `<tr><td>${r.n}</td><td>${r.uma}</td><td>${r.run}</td><td class="num">${cell(v)}</td></tr>`;
      }).join("");
      return `<table class="plain"><thead><tr><th>#</th><th>ウマ娘</th><th>出走者</th><th class="num">${col}</th></tr></thead><tbody>${body}</tbody></table>`;
    }

    function tableCombo(rows, col) {
      const body = rows.map((r) => {
        const v = live ? r.ref : r.conf;
        return `<tr><td>${r.lab}</td><td class="num">${cell(v)}</td></tr>`;
      }).join("");
      return `<table class="plain"><thead><tr><th>買い目</th><th class="num">${col}</th></tr></thead><tbody>${body}</tbody></table>`;
    }

    function paint() {
      const col = live ? "参考" : "確定";
      const pill = document.getElementById("phase-pill");
      pill.textContent = live ? "投票中" : "投票締切";
      pill.classList.toggle("live", live);
      document.getElementById("view-live").classList.toggle("on", live);
      document.getElementById("view-closed").classList.toggle("on", !live);

      document.getElementById("desk").innerHTML = BOARDS.map((b) => {
        const meta = b.all ? `${b.rows.length}頭 · 全頭` : `${b.rows.length}組 · 実票のみ`;
        const showVoid = b.voidWhenClosed && !live;
        const banner = showVoid ? `<p class="odds-void">特払い · 当たりに実票ゼロ · 8割戻し</p>` : "";
        const table = b.all ? tableWin(b.rows, col) : tableCombo(b.rows, col);
        return `<section class="work odds-panel odds-panel-${b.area}">
          <div class="work-head">
            <h2>${b.label} · ${col}</h2>
            <span class="odds-meta">${meta}</span>
          </div>
          ${banner}
          <div class="table-scroll">${table}</div>
        </section>`;
      }).join("");
    }

    document.getElementById("view-live").addEventListener("click", (e) => {
      e.preventDefault(); live = true; paint();
    });
    document.getElementById("view-closed").addEventListener("click", (e) => {
      e.preventDefault(); live = false; paint();
    });
    paint();
  </script>
</body>
</html>
