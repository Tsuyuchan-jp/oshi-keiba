    let sel = 1;

    function paintList() {
      const tb = document.querySelector("#roster tbody");
      tb.innerHTML = ROSTER.map((h) =>
        `<tr data-n="${h.n}" class="${h.n === sel ? "on" : ""}">
          <td>${h.n}</td>
          <td>${h.uma}</td>
          <td>${h.run}</td>
          <td>${h.style}</td>
          <td>${h.score.toFixed(1)}</td>
          <td>${h.source === "manual" ? `<span class="tag warn">直置き</span>` : `<span class="tag">自動</span>`}</td>
          <td>${h.seed.toLocaleString("ja-JP")}</td>
        </tr>`
      ).join("");
      tb.querySelectorAll("tr[data-n]").forEach((tr) => {
        tr.addEventListener("click", () => {
          sel = Number(tr.dataset.n);
          paint();
        });
      });
    }

    function paintPipe() {
      const h = ROSTER.find((x) => x.n === sel);
      const el = document.getElementById("pipe");
      if (h.source === "manual") {
        el.innerHTML = `<h2>${h.n} ${h.uma}</h2>
          <p class="note">${h.run} · ${h.style}</p>
          <div class="pipe-step">
            <div class="pipe-k">経路</div>
            <div>直置き。${h.why}</div>
          </div>
          <div class="pipe-step">
            <div class="pipe-k">評価点（Seed の比）</div>
            <div class="pipe-final">${h.score.toFixed(1)}</div>
          </div>
          <p class="note">式の確認対象は自動算出の頭。直しは出走登録。</p>`;
        return;
      }
      const s = h.skill;
      el.innerHTML = `<h2>${h.n} ${h.uma}</h2>
        <p class="note">${h.run} · ${h.style} · 作者仮置きの式（Neko未確定）</p>
        <div class="pipe-step">
          <div class="pipe-k">土台（スキル）</div>
          <div class="pipe-v">有効 ${s.eff} ＋ 金×2（${s.gold}枚）＋ ためらい ${s.tam}＝ <b>${s.base}</b></div>
          <p class="pipe-eq">緑は枚数に入れない。ためらいは白1。</p>
        </div>
        <div class="pipe-step">
          <div class="pipe-k">緑 → ステへ</div>
          <div>${h.green}</div>
        </div>
        <div class="pipe-step">
          <div class="pipe-k">適性S</div>
          <div>${h.apt}</div>
        </div>
        ${h.mult.map(([k, v]) =>
          `<div class="pipe-step"><div class="pipe-k">${k}</div><div class="pipe-v">${v}</div></div>`
        ).join("")}
        <div class="pipe-step">
          <div class="pipe-k">評価点 → Seed</div>
          <div class="pipe-final">${h.score.toFixed(1)}</div>
          <p class="pipe-eq">Seed ${h.seed.toLocaleString("ja-JP")}（単勝参考の比。連勝には載せない）</p>
        </div>`;
    }

    function paint() {
      paintList();
      paintPipe();
    }
