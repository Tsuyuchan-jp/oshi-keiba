<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tone C — 炭盤 × 赤電光</title>
  <link rel="stylesheet" href="./shared.css">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;600;700&family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #121010;
      --ink: #f3e8e4;
      --muted: #9a8480;
      --line: #3a2a28;
      --accent: #ff4d3a;
      --odds: #ff6b4a;
      --pulse: rgba(255, 77, 58, .22);
      --chrome: #1a1413;
    }
    body { background: var(--bg); color: var(--ink); }
    .chrome { background: var(--chrome); border-bottom-color: #4a302c; }
    .pill { background: rgba(255, 77, 58, .14); color: var(--accent); }
    .deadline { color: var(--accent); font-family: "Chakra Petch", sans-serif; }
    .board-head h1 { font-family: "Chakra Petch", "IBM Plex Sans JP", sans-serif; }
    .sheet-wrap {
      background: #0e0c0c;
      border-color: #5a3028;
      box-shadow: inset 0 0 40px rgba(255, 60, 40, .05);
    }
    table.win th { background: #1c1514; color: #b09088; }
    table.win td.num {
      color: var(--accent);
      font-family: "Chakra Petch", sans-serif;
      text-shadow: 0 0 10px rgba(255, 77, 58, .35);
    }
    table.win td.odds {
      color: var(--odds);
      font-family: "Chakra Petch", "IBM Plex Sans JP", sans-serif;
      text-shadow: 0 0 14px rgba(255, 90, 60, .35);
    }
    table.win td.odds .delta.up { color: #ffb08a; }
    table.win td.odds .delta.down { color: #f0d090; }
    .cta { background: var(--accent); color: #1a0806; }
    .mock-label {
      position: fixed; right: .75rem; bottom: calc(.75rem + env(safe-area-inset-bottom));
      font-size: .68rem; color: #66504c; z-index: 9; pointer-events: none;
    }
    .who { color: var(--muted); font-size: .72rem; }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="chrome">
      <div>
        <a class="brand" href="./index.html">OSHI KEIBA</a>
        <div class="who">neko · 12,800 スペ</div>
      </div>
      <div class="meta">
        <span class="pill"><span class="dot"></span>投票中</span>
      </div>
    </header>
    <section class="board">
      <div class="board-head">
        <h1>第2回 本番</h1>
        <div class="deadline">締切 18:40</div>
      </div>
      <div class="sheet-wrap">
        <table class="win">
          <thead><tr><th>#</th><th>ウマ娘</th><th>出走者</th><th style="text-align:right">オッズ</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="foot">
        <span>Tone C · 炭盤 × 赤電光（強め・長時間は疲労に注意）</span>
        <a class="cta" href="#">馬券を買う</a>
      </div>
    </section>
  </div>
  <div class="mock-label">tone-c</div>
  <script src="./horses.js"></script>
</body>
</html>
