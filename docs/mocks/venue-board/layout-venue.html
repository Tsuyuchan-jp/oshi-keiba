<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>レイアウト：場の中の横長掲示板</title>
  <link rel="stylesheet" href="./shared.css">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;600;700&family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070808;
      --led: #00e8d8;
      --led-dim: #6aa8a4;
      --odds: #ff8a2a;
      --pulse: rgba(255, 138, 42, .28);
    }
    body {
      background: #050607;
      color: #e8fffc;
      font-family: "IBM Plex Sans JP", "Hiragino Sans", sans-serif;
    }
    .scene .app-shell {
      position: relative;
      z-index: 3;
      background: #050505;
      border: 2px solid #d8dce0;
      border-radius: 2px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, .55);
    }
    .chrome {
      background: #000;
      border-bottom: 1px solid #1a3332;
      font-family: "Chakra Petch", "IBM Plex Sans JP", sans-serif;
      letter-spacing: .04em;
      align-items: center;
    }
    .chrome .brand { color: var(--led); }
    .who { color: var(--led-dim); font-size: .72rem; }
    .led-meta {
      display: flex;
      align-items: center;
      gap: .85rem;
      color: var(--led);
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      font-size: .82rem;
      line-height: 1;
    }
    .led-meta > span {
      display: inline-flex;
      align-items: center;
    }
    .led-meta strong { color: #fff; font-weight: 700; }
    .board { padding: .35rem .45rem .55rem; }
    .board-head {
      font-family: "Chakra Petch", "IBM Plex Sans JP", sans-serif;
      color: var(--led);
      margin-bottom: .35rem;
    }
    .board-head h1 {
      font-size: clamp(.95rem, 2.2vw, 1.15rem);
      letter-spacing: .14em;
    }
    .deadline { color: #fff; }
    .sheet-wrap {
      background: #000;
      border: 0;
      border-radius: 0;
      box-shadow: none;
    }
    table.win { font-size: clamp(.78rem, 1.8vw, .9rem); }
    table.win th {
      background: #000;
      color: var(--led-dim);
      font-weight: 500;
      letter-spacing: .16em;
      border-bottom: 1px solid #143230;
    }
    table.win td {
      border-bottom: 1px solid #0c1818;
      padding: .32rem .4rem;
    }
    .led-meta .pill {
      background: rgba(224, 179, 74, .15);
      color: #e0b34a;
      border: 0;
    }
    .led-meta .pill .dot { background: currentColor; }
    table.win { table-layout: fixed; width: 100%; }
    table.win th:nth-child(1),
    table.win td.num {
      width: 1.55rem;
      padding-left: .1rem;
      padding-right: .1rem;
      color: #fff;
      font-family: "Chakra Petch", sans-serif;
      text-shadow: 0 0 6px rgba(255,255,255,.25);
    }
    table.win th:nth-child(2),
    table.win td.name {
      width: auto;
      color: var(--led);
      font-family: "IBM Plex Sans JP", "Hiragino Sans", sans-serif;
      letter-spacing: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 0 8px rgba(0, 232, 216, .25);
    }
    table.win th:nth-child(3),
    table.win td.runner {
      width: 6.5rem;
      color: #c8d4d3;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    table.win th:nth-child(4),
    table.win td.style {
      width: 1.7rem;
      padding-left: 0;
      padding-right: 0;
      color: var(--led);
      font-size: .78em;
      letter-spacing: 0;
      text-align: center;
      white-space: nowrap;
    }
    table.win th:nth-child(5),
    table.win td.odds {
      width: 6.4rem;
      white-space: nowrap;
      color: var(--odds);
      font-family: "Chakra Petch", sans-serif;
      font-size: 1.15em;
      text-shadow: 0 0 10px rgba(255, 138, 42, .35);
    }
    table.win td.odds .delta {
      display: inline-block;
      min-width: 2.4em;
      margin: 0 .35rem 0 0;
      font-size: .72em;
      text-align: right;
    }
    table.win td.odds .delta.up { color: #ff5a4a; }
    table.win td.odds .delta.down { color: var(--led); }
    .cta {
      background: var(--odds);
      color: #140800;
      border: 0;
      border-radius: 2px;
      padding: .65rem 1.35rem;
      font-size: .95rem;
      font-weight: 800;
      letter-spacing: .12em;
      box-shadow: 0 0 18px rgba(255, 138, 42, .35);
    }
    .cta:hover { filter: brightness(1.08); }
    .foot {
      margin-top: .45rem;
      gap: .5rem;
    }
    .foot .hint { display: none; }
    .scene {
      position: relative;
      min-height: 100dvh;
      min-height: 100vh;
      overflow: hidden;
    }
    .scene-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      background-color: #0a1218;
      background-image:
        linear-gradient(180deg, var(--veil-top), var(--veil-bot)),
        var(--scene-portrait);
      background-position: center bottom, center bottom;
      background-size: cover, cover;
      background-repeat: no-repeat;
      transition: opacity .8s ease;
    }
    .scene[data-slot="day"] {
      --veil-top: rgba(20, 28, 36, .18);
      --veil-bot: rgba(12, 18, 16, .28);
      --scene-portrait: url("./venue-day-9x16.png");
      --scene-landscape: url("./venue-day-16x9.png");
    }
    .scene[data-slot="dusk"] {
      --veil-top: rgba(24, 12, 8, .28);
      --veil-bot: rgba(18, 10, 8, .38);
      --scene-portrait: url("./venue-dusk-9x16.png");
      --scene-landscape: url("./venue-dusk-16x9.png");
    }
    .scene[data-slot="night"] {
      --veil-top: rgba(5, 6, 10, .38);
      --veil-bot: rgba(5, 8, 6, .48);
      --scene-portrait: url("./venue-night-9x16.png");
      --scene-landscape: url("./venue-night-16x9.png");
    }
    .slot-bar {
      position: fixed;
      left: .75rem;
      bottom: calc(.75rem + env(safe-area-inset-bottom));
      z-index: 10;
      display: flex;
      gap: .3rem;
      font-size: .72rem;
    }
    .slot-bar button {
      border: 1px solid #4a3f28;
      background: rgba(8, 9, 10, .75);
      color: #c4b896;
      padding: .28rem .5rem;
      border-radius: 6px;
      cursor: pointer;
    }
    .slot-bar button[aria-pressed="true"] {
      background: #f0b429;
      color: #1a1204;
      border-color: #f0b429;
    }
    .mock-label {
      position: fixed; right: .75rem; bottom: calc(.75rem + env(safe-area-inset-bottom));
      font-size: .68rem; color: #9aa080; z-index: 9; pointer-events: none;
      background: rgba(0,0,0,.5); padding: .3rem .55rem; border-radius: 6px;
    }
    .cols { display: flex; gap: 0; min-height: 0; flex: 1; }
    .cols .sheet-wrap { flex: 1; }

    /* スマホ：盤はほぼ画面いっぱい。端だけ場が見える */
    @media (max-width: 899px) {
      .scene { height: 100dvh; height: 100vh; }
      .scene .app-shell {
        height: calc(100% - 28px);
        margin: 14px;
        width: calc(100% - 28px);
        overflow: hidden;
      }
      .col-b { display: none; }
      .foot { display: block; }
      .cta {
        display: flex;
        justify-content: center;
        width: 100%;
        padding: .8rem 1rem;
      }
    }

    /* PC：横長のビジョン。全幅にはしない。縦に引き伸ばさない */
    @media (min-width: 900px) {
      .scene {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100dvh;
        height: 100vh;
      }
      .scene-bg {
        background-image:
          linear-gradient(180deg, var(--veil-top), var(--veil-bot)),
          var(--scene-landscape);
        background-position: center, center;
      }
      .scene .app-shell {
        width: min(68rem, calc(100vw - 4rem));
        height: auto;
        max-height: min(36rem, calc(100dvh - 4rem));
        margin: 0;
        overflow: hidden;
      }
      .foot { justify-content: flex-end; }
      .cta { min-width: 11rem; text-align: center; }
    }
  </style>
</head>
<body>
  <div class="scene" data-slot="night">
    <div class="scene-bg" aria-hidden="true"></div>
    <div class="app-shell">
      <header class="chrome">
        <div>
          <a class="brand" href="./index.html">OSHI KEIBA</a>
          <div class="who">neko · 12,800 スペ</div>
        </div>
        <div class="led-meta">
          <span class="pill"><span class="dot"></span>投票中</span>
          <span>現在 <strong id="now-clock">18:12</strong></span>
          <span>締切 <strong>18:40</strong></span>
        </div>
      </header>
      <section class="board">
        <div class="board-head">
          <h1>第2回 本番　単勝　芝・中　稍重</h1>
        </div>
        <div class="cols">
          <div class="sheet-wrap">
            <table class="win">
              <thead><tr><th>#</th><th>ウマ娘</th><th>出走者</th><th>脚質</th><th style="text-align:right">オッズ</th></tr></thead>
              <tbody id="rows-a"></tbody>
            </table>
          </div>
          <div class="sheet-wrap col-b">
            <table class="win">
              <thead><tr><th>#</th><th>ウマ娘</th><th>出走者</th><th>脚質</th><th style="text-align:right">オッズ</th></tr></thead>
              <tbody id="rows-b"></tbody>
            </table>
          </div>
        </div>
        <div class="foot">
          <span class="hint"></span>
          <a class="cta" href="#">馬券を買う</a>
        </div>
      </section>
    </div>
  </div>
  <div class="slot-bar" role="group" aria-label="背景の時間帯">
    <button type="button" data-slot="auto">自動</button>
    <button type="button" data-slot="day">日中</button>
    <button type="button" data-slot="dusk">夕方</button>
    <button type="button" data-slot="night">ナイター</button>
  </div>
  <div class="mock-label">端の芝が見えるか・時間帯を切替</div>
  <script>
    (function slotBg() {
      const scene = document.querySelector(".scene");
      const buttons = [...document.querySelectorAll(".slot-bar [data-slot]")];
      const q = new URLSearchParams(location.search).get("slot");
      function jstHour() {
        const p = new Intl.DateTimeFormat("en-US", {
          timeZone: "Asia/Tokyo", hour: "numeric", hour12: false,
        }).formatToParts(new Date());
        return Number(p.find((x) => x.type === "hour").value);
      }
      function fromClock() {
        const h = jstHour();
        if (h >= 6 && h < 16) return "day";
        if (h >= 16 && h < 19) return "dusk";
        return "night";
      }
      let mode = (q === "day" || q === "dusk" || q === "night") ? q : "auto";
      function apply() {
        const slot = mode === "auto" ? fromClock() : mode;
        scene.dataset.slot = slot;
        for (const b of buttons) {
          const on = b.dataset.slot === mode;
          b.setAttribute("aria-pressed", on ? "true" : "false");
        }
      }
      for (const b of buttons) {
        b.addEventListener("click", () => {
          mode = b.dataset.slot;
          apply();
        });
      }
      apply();
      const clock = document.getElementById("now-clock");
      if (clock) {
        const tick = () => {
          clock.textContent = new Intl.DateTimeFormat("ja-JP", {
            timeZone: "Asia/Tokyo", hour: "2-digit", minute: "2-digit", hour12: false,
          }).format(new Date());
        };
        tick();
        setInterval(tick, 10000);
      }
    })();
    const horses = [
      [1, "サイレンススズカ", "逃げ", "あお", "3.2", "down", "0.2"],
      [2, "スペシャルウィーク", "先行", "つゆ", "5.8", "", ""],
      [3, "グラスワンダー", "差し", "ren", "8.1", "up", "0.4"],
      [4, "セイウンスカイ", "逃げ", "neko", "12.4", "", ""],
      [5, "エルコンドルパサー", "先行", "momo", "6.0", "down", "0.1"],
      [6, "テイエムオペラオー", "追込", "kai", "15.2", "", ""],
      [7, "ファインモーション", "差し", "yuki", "9.7", "up", "0.3"],
      [8, "ナリタブライアン", "先行", "sora", "18.0", "", ""],
      [9, "メジロマックイーン", "追込", "hana", "7.4", "", ""],
      [10, "トウカイテイオー", "逃げ", "rio", "11.1", "up", "0.5"],
      [11, "ビワハヤヒデ", "差し", "ken", "22.6", "", ""],
      [12, "ミホノブルボン", "逃げ", "mai", "14.3", "down", "0.2"],
      [13, "サクラバクシンオー", "逃げ", "leo", "16.8", "", ""],
      [14, "タイキシャトル", "先行", "ami", "10.5", "", ""],
      [15, "エアグルーヴ", "差し", "jun", "13.9", "up", "0.2"],
      [16, "シンボリルドルフ", "先行", "tori", "4.6", "down", "0.3"],
      [17, "オグリキャップ", "追込", "nana", "19.2", "", ""],
      [18, "タマモクロス", "追込", "bee", "25.0", "", ""],
    ];
    function fill(el, list) {
      for (const [n, uma, style, runner, odds, dir, d] of list) {
        const tr = document.createElement("tr");
        if (n === 3) tr.className = "pulse";
        tr.innerHTML = `<td class="num">${n}</td><td class="name">${uma}</td><td class="runner">${runner}</td><td class="style">${style}</td>
          <td class="odds">${dir ? `<span class="delta ${dir}">${dir === "up" ? "↑" : "↓"}${d}</span>` : `<span class="delta"></span>`}${odds}</td>`;
        el.appendChild(tr);
      }
    }
    function render() {
      const a = document.getElementById("rows-a");
      const b = document.getElementById("rows-b");
      a.innerHTML = "";
      b.innerHTML = "";
      const wide = window.matchMedia("(min-width: 900px)").matches;
      if (wide) {
        fill(a, horses.slice(0, 9));
        fill(b, horses.slice(9));
      } else {
        fill(a, horses);
      }
    }
    render();
    window.matchMedia("(min-width: 900px)").addEventListener("change", render);
    setInterval(() => {
      const tr = document.querySelector("#rows-a tr.pulse") || document.querySelector("#rows-a tr");
      if (!tr) return;
      tr.classList.remove("pulse");
      void tr.offsetWidth;
      tr.classList.add("pulse");
    }, 4000);
  </script>
</body>
</html>
