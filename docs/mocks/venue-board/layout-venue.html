<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>レイアウト：場内に掲示板</title>
  <link rel="stylesheet" href="./shared.css">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;600;700&family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070808;
      --ink: #ece7dc;
      --muted: #8a8578;
      --line: #2a2824;
      --accent: #f0b429;
      --pulse: rgba(240, 180, 41, .28);
      --chrome: #0c0d0e;
    }
    body { background: #050607; color: var(--ink); }
    .scene {
      position: relative;
      height: 100dvh;
      height: 100vh;
      overflow: hidden;
    }
    /* 夜のスタンドから芝を見る雰囲気（写真なし・CSSのみ） */
    .sky {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% 100%, rgba(80, 90, 40, .35), transparent 55%),
        radial-gradient(ellipse 40% 30% at 20% 10%, rgba(255, 220, 140, .08), transparent 50%),
        radial-gradient(ellipse 30% 25% at 80% 8%, rgba(255, 200, 80, .07), transparent 45%),
        linear-gradient(180deg, #0a1020 0%, #12161c 42%, #1a2218 70%, #243018 100%);
      z-index: 0;
    }
    .flood {
      position: absolute;
      top: 0;
      left: 8%;
      right: 8%;
      height: 28%;
      background: radial-gradient(ellipse at 50% 0%, rgba(255, 236, 180, .18), transparent 70%);
      pointer-events: none;
      z-index: 1;
    }
    .turf {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 28%;
      background:
        repeating-linear-gradient(
          90deg,
          rgba(46, 92, 42, .55) 0 12px,
          rgba(38, 78, 36, .55) 12px 24px
        ),
        linear-gradient(180deg, rgba(20, 28, 16, .2), #1a2a14);
      border-top: 3px solid #c4a574;
      z-index: 1;
    }
    .rail {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 27%;
      height: 6px;
      background: linear-gradient(#e8d5a8, #8a7348);
      z-index: 2;
      box-shadow: 0 8px 24px rgba(0,0,0,.4);
    }
    .scene .app-shell {
      position: relative;
      z-index: 3;
      background: transparent;
    }
    .chrome { background: rgba(8, 9, 10, .72); backdrop-filter: blur(8px); border-bottom-color: #3a3428; }
    .pill { background: rgba(240, 180, 41, .12); color: var(--accent); }
    .deadline { color: var(--accent); font-family: "Chakra Petch", sans-serif; }
    .board-head h1 { font-family: "Chakra Petch", "IBM Plex Sans JP", sans-serif; }
    .sheet-wrap {
      background: #0a0a0b;
      border-color: #3d3420;
      box-shadow: inset 0 0 0 1px rgba(240, 180, 41, .08);
    }
    table.win th { background: #121110; color: #a89b78; }
    table.win td.num { color: #c4b896; font-family: "Chakra Petch", sans-serif; }
    table.win td.odds {
      color: var(--accent);
      font-family: "Chakra Petch", "IBM Plex Sans JP", sans-serif;
      text-shadow: 0 0 12px rgba(240, 180, 41, .25);
    }
    table.win td.odds .delta.up { color: #ff8e6b; }
    table.win td.odds .delta.down { color: #7dcea0; }
    .cta { background: var(--accent); color: #1a1204; }
    .who { color: var(--muted); font-size: .72rem; }
    .mock-label {
      position: fixed; right: .75rem; bottom: calc(.75rem + env(safe-area-inset-bottom));
      font-size: .68rem; color: #9aa080; z-index: 9; pointer-events: none;
      background: rgba(0,0,0,.5); padding: .3rem .55rem; border-radius: 6px;
    }

    /* 狭い幅：盤が画面いっぱい（いま気に入っている手触り） */
    @media (max-width: 719px) {
      .sky, .flood, .turf, .rail { display: none; }
      .scene .app-shell { background: #070808; }
    }

    /* 広い幅：場の中に「実物の掲示板」がある。盤は伸ばさない */
    @media (min-width: 720px) {
      .scene .app-shell {
        max-width: 28rem;
        width: 100%;
        margin: 1.5rem auto;
        height: calc(100dvh - 3rem);
        background: #0c0d0e;
        border: 1px solid #4a3f28;
        border-radius: 10px;
        box-shadow:
          0 0 0 1px rgba(240, 180, 41, .12),
          0 24px 60px rgba(0, 0, 0, .55),
          0 0 80px rgba(240, 180, 41, .08);
        overflow: hidden;
      }
      .scene .app-shell .board { padding: .75rem .85rem 1rem; }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="sky" aria-hidden="true"></div>
    <div class="flood" aria-hidden="true"></div>
    <div class="turf" aria-hidden="true"></div>
    <div class="rail" aria-hidden="true"></div>
    <div class="app-shell">
      <header class="chrome">
        <div>
          <a class="brand" href="./index.html">OSHI KEIBA</a>
          <div class="who">neko · 12,800 スペ</div>
        </div>
        <div class="meta">
          <span class="pill"><span class="dot"></span>投票中</span>
        </div>
      </header>
      <section class="board">
        <div class="board-head">
          <h1>第2回 本番</h1>
          <div class="deadline">締切 18:40</div>
        </div>
        <div class="sheet-wrap">
          <table class="win">
            <thead><tr><th>#</th><th>ウマ娘</th><th>出走者</th><th style="text-align:right">オッズ</th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div class="foot">
          <span>狭い幅＝盤全画面／広い幅＝場の中の掲示板</span>
          <a class="cta" href="#">馬券を買う</a>
        </div>
      </section>
    </div>
  </div>
  <div class="mock-label">layout: venue · 幅を変えて見てください</div>
  <script src="./horses.js"></script>
</body>
</html>
