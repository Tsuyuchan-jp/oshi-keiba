<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>レイアウト：アプリシェル型</title>
  <link rel="stylesheet" href="./shared.css">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0e1012;
      --ink: #eef0f2;
      --muted: #8b929a;
      --line: #2a3038;
      --accent: #e0b34a;
      --pulse: rgba(224, 179, 74, .35);
      --chrome: #14171a;
    }
    body { background: var(--bg); color: var(--ink); }
    .chrome { background: var(--chrome); }
    .pill {
      background: rgba(224, 179, 74, .15);
      color: var(--accent);
    }
    .deadline { color: var(--accent); }
    table.win th { background: #1a1e23; color: var(--muted); }
    table.win td.odds { color: var(--accent); }
    table.win td.odds .delta.up { color: #ff7a7a; }
    table.win td.odds .delta.down { color: #6ddea0; }
    .cta {
      background: var(--accent);
      color: #1a1408;
    }
    .mock-label {
      position: fixed;
      right: .75rem;
      bottom: calc(.75rem + env(safe-area-inset-bottom));
      background: #000;
      color: #aaa;
      font-size: .68rem;
      padding: .3rem .55rem;
      border-radius: 6px;
      opacity: .8;
      z-index: 9;
      pointer-events: none;
    }
    .who { color: var(--muted); font-size: .72rem; }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="chrome">
      <div>
        <a class="brand" href="./index.html">OSHI KEIBA</a>
        <div class="who">neko · 12,800 スペ</div>
      </div>
      <div class="meta">
        <span class="pill"><span class="dot"></span>投票中</span>
        <a href="./index.html" style="color:var(--muted);text-decoration:none;font-size:.75rem">一覧</a>
      </div>
    </header>
    <section class="board">
      <div class="board-head">
        <h1>第2回 本番</h1>
        <div class="deadline">締切 18:40</div>
      </div>
      <div class="sheet-wrap">
        <table class="win">
          <thead>
            <tr><th>#</th><th>ウマ娘</th><th>出走者</th><th style="text-align:right">オッズ</th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="foot">
        <span>盤面は画面いっぱい。表だけスクロール。</span>
        <a class="cta" href="#">馬券を買う</a>
      </div>
    </section>
  </div>
  <div class="mock-label">layout: app shell · 100dvh</div>
  <script>
    const horses = [
      [1, "サイレンススズカ", "あお", "3.2", "down", "0.2"],
      [2, "スペシャルウィーク", "つゆ", "5.8", "", ""],
      [3, "グラスワンダー", "ren", "8.1", "up", "0.4"],
      [4, "セイウンスカイ", "neko", "12.4", "", ""],
      [5, "エルコンドルパサー", "momo", "6.0", "down", "0.1"],
      [6, "テイエムオペラオー", "kai", "15.2", "", ""],
      [7, "ファインモーション", "yuki", "9.7", "up", "0.3"],
      [8, "ナリタブライアン", "sora", "18.0", "", ""],
      [9, "メジロマックイーン", "hana", "7.4", "", ""],
      [10, "トウカイテイオー", "rio", "11.1", "up", "0.5"],
      [11, "ビワハヤヒデ", "ken", "22.6", "", ""],
      [12, "ミホノブルボン", "mai", "14.3", "down", "0.2"],
      [13, "サクラバクシンオー", "leo", "16.8", "", ""],
      [14, "タイキシャトル", "ami", "10.5", "", ""],
      [15, "エアグルーヴ", "jun", "13.9", "up", "0.2"],
      [16, "シンボリルドルフ", "tori", "4.6", "down", "0.3"],
      [17, "オグリキャップ", "nana", "19.2", "", ""],
      [18, "タマモクロス", "bee", "25.0", "", ""],
    ];
    const tb = document.getElementById("rows");
    for (const [n, uma, runner, odds, dir, d] of horses) {
      const tr = document.createElement("tr");
      if (n === 3) tr.className = "pulse";
      tr.innerHTML = `<td class="num">${n}</td><td class="name">${uma}</td><td class="runner">${runner}</td>
        <td class="odds">${odds}${dir ? `<span class="delta ${dir}">${dir === "up" ? "↑" : "↓"}${d}</span>` : ""}</td>`;
      tb.appendChild(tr);
    }
    setInterval(() => {
      const tr = tb.children[2];
      tr.classList.remove("pulse");
      void tr.offsetWidth;
      tr.classList.add("pulse");
    }, 4000);
  </script>
</body>
</html>
