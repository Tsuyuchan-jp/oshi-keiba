<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ウマ柱モック — 枠色けばけば案</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f7f3e8;
      --ink: #1a1814;
      --rule: #1a1814;
      --muted: #6a6458;
      --mark: #c41218;
      --hb: #163a8a;
      --col-w: 3.32rem;
      --stub-w: 2.15rem;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "IBM Plex Sans JP", "Hiragino Sans", sans-serif;
      background: #2a3038;
      color: #e8eaed;
    }
    .stage { padding: 1rem 1.1rem 3rem; }
    .note {
      color: #9aa4b0;
      font-size: 0.8rem;
      line-height: 1.55;
      max-width: 52rem;
      margin: 0 0 0.85rem;
    }
    h1 { font-size: 1.05rem; font-weight: 800; margin: 0 0 0.4rem; }
    h2 {
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      margin: 1.4rem 0 0.45rem;
      color: #c9d0d8;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin: 0 0 1rem;
    }
    .toolbar button {
      font: inherit;
      font-size: 0.78rem;
      font-weight: 700;
      border: 0;
      border-radius: 3px;
      padding: 0.28rem 0.7rem;
      background: #3d4650;
      color: #e8eaed;
      cursor: pointer;
    }
    .toolbar button.on { background: #e8eaed; color: #1a1814; }

    .sheet-wrap {
      overflow-x: auto;
      background: #1d2228;
      padding: 0.7rem;
      border-radius: 4px;
    }
    .paper {
      box-sizing: content-box;
      display: flex;
      flex-direction: column;
      width: max-content;
      min-width: calc(var(--stub-w) + 4 * var(--col-w));
      background: var(--paper);
      color: var(--ink);
      border: 2px solid var(--rule);
    }
    .mast {
      display: flex;
      flex-wrap: wrap;
      gap: 0.12rem 0.85rem;
      align-items: baseline;
      padding: 0.18rem 0.28rem 0.16rem;
      border-bottom: 2px solid var(--rule);
      font-weight: 800;
      font-size: 0.78rem;
      width: 0;
      min-width: 100%;
      box-sizing: border-box;
    }
    .mast .title, .mast .meta { flex: none; white-space: nowrap; }
    .mast .title { font-size: 0.92rem; letter-spacing: 0.04em; }
    .mast .meta { font-weight: 700; font-size: 0.62rem; color: #3c382f; }
    .mast .keys { min-width: 0; font-weight: 400; font-size: 0.5rem; color: var(--muted); margin-left: auto; }

    .board {
      display: grid;
      grid-template-columns: var(--stub-w) repeat(var(--n), var(--col-w));
      grid-template-rows: repeat(8, auto);
    }
    .col {
      display: grid;
      grid-template-rows: subgrid;
      grid-row: 1 / span 8;
      border-left: 2px solid var(--rule);
      min-width: var(--col-w);
      min-height: 0;
    }
    .stub-col {
      border-left: 0;
      background: #e4ddd0;
      min-width: var(--stub-w);
    }
    .cell {
      border-bottom: 1px solid #9e9686;
      padding: 0.08rem 0.04rem;
      text-align: center;
      min-width: 0;
    }
    .stub-cell {
      color: var(--muted);
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    /* 短い行は縦書きするとデータ行より高くなるので横書き＋小さめ */
    .stub-h {
      writing-mode: horizontal-tb;
      font-size: 0.46rem;
      line-height: 1.15;
      letter-spacing: 0.02em;
      padding: 0.06rem 0.05rem;
      word-break: break-all;
    }
    .stub-col .runner.stub-h {
      word-break: normal;
      white-space: nowrap;
      font-size: 0.5rem;
      letter-spacing: 0;
    }
    .stub-split {
      flex-direction: column;
      gap: 0.02rem;
      line-height: 1.1;
      word-break: normal;
    }
    /* 縦書きは内側。セルに writing-mode を付けると vertical-rl で右に寄る */
    .stub-v > span {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-size: 0.52rem;
      letter-spacing: 0.08em;
      line-height: 1;
    }

    /* データ列だけ縦積み。stub にも付けると vertical-rl が右に寄る */
    .col:not(.stub-col) .id-row {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      min-height: 0;
      padding: 0;
    }
    .stub-col .id-row {
      flex-direction: row;
      align-items: center;
      justify-content: center;
    }
    .waku-box {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 1.42rem;
      line-height: 1;
    }
    .waku-box b {
      font-size: 1.08rem;
      font-weight: 800;
      transform: translateY(0.06em);
    }
    .style {
      display: block;
      width: 100%;
      box-sizing: border-box;
      font-size: 0.58rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      line-height: 1;
      border-top: 1px solid #9e9686;
      padding: 0.07rem 0.04rem 0.08rem;
    }
    .style > span { display: inline-block; transform: translateY(0.06em); }
    .style-逃 { background: #f3c4c4; color: #7a1010; }
    .style-先 { background: #f3d9b0; color: #7a3e08; }
    .style-差 { background: #c9d6ee; color: #1a3366; }
    .style-追 { background: #c9e4cf; color: #145228; }

    /* 枠色（見た目専用。JRA割当）。白枠に内線を足すと16頭の1・2番だけ二重線になる */
    .waku-box.w1 { background: #fff; color: #1a1814; }
    .waku-box.w2 { background: #111; color: #fff; }
    .waku-box.w3 { background: #d01218; color: #fff; }
    .waku-box.w4 { background: #1a4aa8; color: #fff; }
    .waku-box.w5 { background: #f0d000; color: #1a1814; }
    .waku-box.w6 { background: #1a8a3a; color: #fff; }
    .waku-box.w7 { background: #e87810; color: #1a1814; }
    .waku-box.w8 { background: #f090b0; color: #1a1814; }
    .col.tint-w1 { background: #f3efe4; }
    .col.tint-w2 { background: #eceae6; }
    .col.tint-w3 { background: #f8e8e6; }
    .col.tint-w4 { background: #e7edf6; }
    .col.tint-w5 { background: #f7f1c8; }
    .col.tint-w6 { background: #e6f1e8; }
    .col.tint-w7 { background: #f7ead8; }
    .col.tint-w8 { background: #f6e4ec; }

    .who {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 0.1rem;
      padding: 0.1rem 0.04rem 0.12rem;
      border-bottom: 2px solid var(--rule);
    }
    .stub-col .who {
      justify-content: center;
      padding: 0.18rem 0.06rem;
    }
    .who img, .who .ph {
      width: 1.95rem;
      height: 1.95rem;
      object-fit: contain;
      flex: none;
    }
    .who .ph {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 800;
      background: #ddd6c6;
    }
    .uma {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: calc(9em + 8 * 0.08em + 0.85rem);
      font-size: 0.78rem;
      font-weight: 800;
      line-height: 1;
    }
    .uma > span { flex: none; line-height: 1; }
    .uma > span.choon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 1em;
      height: 1em;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      transform: translateX(-0.07em);
    }
    .runner {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.56rem;
      font-weight: 700;
      line-height: 1.15;
      min-height: 1.4rem;
      padding-left: 0.04rem;
      padding-right: 0.04rem;
    }
    .runner span {
      white-space: nowrap;
      overflow: hidden;
      max-width: 100%;
      transform: translateY(0.2em);
    }

    .score-cell {
      min-height: 1.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.06rem 0.02rem;
      background: var(--hb);
    }
    .score-cell b {
      font-size: 0.9rem;
      font-weight: 800;
      color: #fff;
      line-height: 1;
      transform: translateY(0.08em);
    }
    .stub-col .score-cell { background: #e4ddd0; }
    .odds-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.04rem;
      min-height: 2.4rem;
      padding: 0.08rem 0.02rem;
    }
    .odds-cell .k { display: block; font-size: 0.5rem; color: var(--muted); font-weight: 600; }
    .odds-cell .mk {
      min-height: 1.1rem;
      font-size: 1.08rem;
      font-weight: 800;
      color: var(--mark);
      line-height: 1.15;
      padding: 0 0.16rem;
    }
    .odds-cell .mk.none {
      color: #8d8678;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0;
      background: transparent;
      box-shadow: none;
    }
    .odds-cell b { font-size: 0.92rem; font-weight: 800; line-height: 1; }

    .stats {
      font-size: 0.48rem;
      font-variant-numeric: tabular-nums;
      line-height: 1.18;
      text-align: left;
      padding: 0.04rem 0.08rem 0.04rem 0.08rem;
    }
    .stats.empty {
      min-height: 1.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .stats span {
      display: flex;
      justify-content: space-between;
      padding: 0.02rem 0.06rem 0.02rem 0;
      border-bottom: 1px dotted #b7ae9c;
    }
    .stats span:last-child { border-bottom: 0; }
    .stats .lab { color: var(--muted); font-weight: 600; font-size: 0.42rem; }
    .empty { color: var(--muted); text-align: center; }

    .apt {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.02rem;
      font-size: 0.5rem;
      font-weight: 700;
      line-height: 1.15;
      min-height: 2rem;
      padding: 0.06rem 0.02rem;
    }
    .apt .s {
      color: var(--mark);
      background: #f8d4d4;
      padding: 0 0.12rem;
    }

    .sp { min-height: 2.95rem; padding: 0.08rem 0.02rem; }
    .sp b {
      display: block;
      font-size: 1.08rem;
      font-weight: 800;
      line-height: 1;
      /* 墨の全幅帯は重いので、紺の数字箱にする */
      background: #3d5a8a;
      color: #fff;
      margin: 0 0.08rem;
      padding: 0.08rem 0.04rem 0.06rem;
    }
    .sp small { display: block; font-size: 0.42rem; color: #4a453c; font-weight: 600; margin-top: 0.02rem; line-height: 1; }
    .sp small:first-of-type { margin-top: 0.08rem; }
    .sp small.gold {
      background: #ead56a;
      color: #1a1814;
      font-weight: 800;
      margin: 0.04rem 0.08rem 0;
      padding: 0.04rem 0.04rem;
    }
    /* 色箱は動かさず、字面だけ下げる（番・脚と同じ） */
    .sp b > span,
    .sp small > span {
      display: inline-block;
      transform: translateY(0.08em);
    }
  </style>
</head>
<body>
  <div class="stage">
    <h1>ウマ柱モック</h1>
    <p class="note">見た目案（本番未適用）。ウマ番を JRA 枠色で塗る（保存しない）。評価点は紺地白字。列に薄い枠色地。脚質は控えめな帯色。petit に背景は付けない。頭数切替で枠の塊を確認。</p>
    <div class="toolbar" id="toolbar"></div>
    <h2>紙面（けばけば案）</h2>
    <p class="note">列頭は枠色箱のウマ番＋脚質。ウマ娘行の下は太罫。印はオッズ欄の上段。SP点数は紺の数字箱、金は黄地。</p>
    <div class="sheet-wrap" id="b"></div>
  </div>
  <script>
    /* モック用の仮データ。本番の差し込みとは別。petit はリポジトリの実ファイル名 */
    const PETIT_DIR = "../../../public/images/umamusume/petit/";
    const ALL = [
      { n: 1, uma: "スペシャルウィーク", runner: "プレビュー太郎左衛門", style: "先", score: 128.4, odds: 3.8, sp: 28, eff: 16, gold: 5, stats: [1204, 980, 1120, 880, 1010], apt: ["芝S", "中S", "先A"], petit: "petit_1001_100101_0010.png" },
      { n: 2, uma: "サイレンススズカ", runner: "みほ", style: "逃", score: 121.0, odds: 5.2, sp: 24, eff: 14, gold: 4, stats: [1188, 860, 1040, 820, 990], apt: ["芝S", "中A", "逃S"], petit: "petit_1002_100201_0010.png" },
      { n: 3, uma: "トウカイテイオー", runner: "帝王くん", style: "先", score: 114.6, odds: 6.1, sp: 22, eff: 12, gold: 4, stats: [1160, 920, 1088, 900, 940], apt: ["芝S", "中S", "先S"], petit: "petit_1003_100301_0010.png" },
      { n: 4, uma: "メジロマックイーン", runner: "麦", style: "差", score: 109.2, odds: 7.4, sp: 21, eff: 13, gold: 3, stats: [1102, 1180, 1020, 860, 970], apt: ["芝A", "長S", "差A"], petit: "petit_1013_101301_0010.png" },
      { n: 5, uma: "オグリキャップ", runner: "笠松", style: "差", score: 104.8, odds: 8.9, sp: 20, eff: 11, gold: 4, stats: [1140, 900, 1110, 840, 920], apt: ["芝A", "マS", "差A"], petit: "petit_1020_102001_0010.png" },
      { n: 6, uma: "ゴールドシップ", runner: "しまさん", style: "追", score: 98.5, odds: 11.2, sp: 19, eff: 10, gold: 4, stats: [1088, 1040, 990, 910, 880], apt: ["芝A", "中A", "追S"], petit: "petit_1035_103516_0010.png" },
      { n: 7, uma: "ナリタブライアン", runner: "直置き花子", style: "先", score: 92.0, odds: 14.6, sp: null, eff: null, gold: null, stats: null, apt: null, petit: "petit_1039_103901_0010.png" },
      { n: 8, uma: "シンボリルドルフ", runner: "皇帝", style: "先", score: 88.4, odds: 16.8, sp: 17, eff: 9, gold: 3, stats: [1120, 1000, 1060, 950, 1020], apt: ["芝S", "中A", "先A"], petit: "petit_1017_101701_0010.png" },
      { n: 9, uma: "テイエムオペラオー", runner: "王様", style: "先", score: 81.1, odds: 22.4, sp: 16, eff: 10, gold: 2, stats: [1090, 960, 1010, 870, 930], apt: ["芝A", "中S", "先A"], petit: "petit_1055_105501_0010.png" },
      { n: 10, uma: "エルコンドルパサー", runner: "コンドル", style: "差", score: 76.3, odds: 28.0, sp: 15, eff: 8, gold: 3, stats: [1130, 840, 1070, 800, 910], apt: ["芝A", "マA", "差S"], petit: "petit_1066_106601_0010.png" },
      { n: 11, uma: "ヒシミラクル", runner: "ひし", style: "追", score: 70.2, odds: 36.5, sp: 14, eff: 9, gold: 2, stats: [1040, 1010, 980, 890, 860], apt: ["芝A", "中A", "追A"], petit: "petit_1050_105001_0010.png" },
      { n: 12, uma: "マチカネフクキタル", runner: "福来", style: "差", score: 64.8, odds: 48.2, sp: 12, eff: 7, gold: 2, stats: [1020, 880, 990, 820, 900], apt: ["芝A", "中A", "差A"], petit: "petit_1022_102201_0010.png" },
      { n: 13, uma: "セイウンスカイ", runner: "しょーじ", style: "逃", score: 61.0, odds: 55.0, sp: 13, eff: 8, gold: 2, stats: [1110, 820, 1000, 780, 870], apt: ["芝A", "中A", "逃S"], petit: "petit_1027_102701_0010.png" },
      { n: 14, uma: "アドマイヤベガ", runner: "ベガ", style: "差", score: 58.4, odds: 62.0, sp: 11, eff: 6, gold: 2, stats: [1070, 900, 1030, 810, 890], apt: ["芝A", "中A", "差A"], petit: "petit_1083_108301_0010.png" },
      { n: 15, uma: "ファインモーション", runner: "細", style: "先", score: 55.1, odds: 71.0, sp: 10, eff: 6, gold: 1, stats: [1050, 870, 980, 800, 940], apt: ["芝S", "マA", "先A"], petit: "petit_1102_110201_0010.png" },
      { n: 16, uma: "ダイワスカーレット", runner: "赤", style: "逃", score: 52.0, odds: 82.0, sp: 10, eff: 5, gold: 2, stats: [1140, 800, 1010, 770, 850], apt: ["芝A", "マS", "逃A"], petit: "petit_1061_106101_0010.png" },
      { n: 17, uma: "ウオッカ", runner: "ウォッカ", style: "先", score: 49.6, odds: 91.0, sp: 9, eff: 5, gold: 1, stats: [1160, 760, 1040, 740, 880], apt: ["芝A", "マS", "先A"], petit: "petit_1032_103201_0010.png" },
      { n: 18, uma: "ダイタクヘリオス", runner: "太陽", style: "逃", score: 44.2, odds: 120.0, sp: 8, eff: 4, gold: 1, stats: [1080, 740, 990, 720, 800], apt: ["芝A", "マA", "逃A"], petit: "petit_9002_900201_0010.png" },
    ];

    /* ウマ番と頭数から JRA 枠番（1〜8）。見た目専用 */
    function wakuOf(umaban, n) {
      if (n <= 8) return umaban;
      const per = [1, 1, 1, 1, 1, 1, 1, 1];
      let remain = Math.min(n, 16) - 8;
      for (let f = 7; f >= 0 && remain > 0; f--) {
        per[f] += 1;
        remain -= 1;
      }
      if (n >= 17) per[6] += 1;
      if (n >= 18) per[7] += 1;
      let horse = 1;
      for (let f = 0; f < 8; f++) {
        if (umaban < horse + per[f]) return f + 1;
        horse += per[f];
      }
      return 8;
    }

    function marksFor(horses) {
      const order = horses.map((h, i) => i).sort((a, b) => {
        if (horses[b].score !== horses[a].score) return horses[b].score - horses[a].score;
        return horses[a].n - horses[b].n;
      });
      const table = ["◎", "○", "▲", "△", "△", "△"];
      const out = Array(horses.length).fill("─");
      order.forEach((idx, rank) => { out[idx] = table[rank] || "─"; });
      return out;
    }

    const STYLE_JA = { 逃: "逃げ", 先: "先行", 差: "差し", 追: "追込" };
    const STAT_L = ["速", "スタ", "パ", "根", "賢"];

    function statsHtml(h) {
      if (!h.stats) return `<div class="cell stats empty">—</div>`;
      return `<div class="cell stats">${h.stats.map((v, i) => `<span><span class="lab">${STAT_L[i]}</span>${v}</span>`).join("")}</div>`;
    }
    function aptHtml(h) {
      if (!h.apt) return `<div class="cell apt empty">—</div>`;
      return `<div class="cell apt">${h.apt.map((t) => t.endsWith("S") ? `<span class="s">${t}</span>` : `<span>${t}</span>`).join("")}</div>`;
    }
    function spHtml(h) {
      if (h.sp == null) return `<div class="cell sp empty">—</div>`;
      const white = Math.max(0, (h.eff ?? 0) - (h.gold ?? 0));
      return `<div class="cell sp"><b><span>${h.sp}</span></b><small><span>有効</span></small><small><span>白${white}</span></small><small class="gold"><span>金${h.gold}</span></small></div>`;
    }
    function face(h) {
      const ch = h.uma.slice(0, 1);
      return `<img src="${PETIT_DIR}${h.petit}" alt="" data-ph="${ch}" onerror="this.outerHTML='<div class=ph>'+this.dataset.ph+'</div>'">`;
    }

    function umaChars(name) {
      return Array.from(name).map((c) => {
        const choon = c === "ー" || c === "ｰ";
        return `<span${choon ? ' class="choon"' : ""}>${c}</span>`;
      }).join("");
    }
    function whoHtml(h) {
      return `<div class="cell who">${face(h)}<span class="uma" aria-label="${h.uma}">${umaChars(h.uma)}</span></div>`;
    }
    function markHtml(mark) {
      if (!mark || mark === "─") return `<span class="mk none" aria-label="無印">─</span>`;
      return `<span class="mk">${mark}</span>`;
    }
    function oddsHtml(h, mark) {
      return `<div class="cell odds-cell">${markHtml(mark)}<b>${h.odds.toFixed(1)}</b></div>`;
    }
    function col(h, mark, nHead) {
      const w = wakuOf(h.n, nHead);
      return `<div class="col tint-w${w}">
        <div class="cell id-row">
          <div class="waku-box w${w}"><b>${h.n}</b></div>
          <span class="style style-${h.style}"><span>${STYLE_JA[h.style] || h.style}</span></span>
        </div>
        ${whoHtml(h)}
        <div class="cell runner"><span>${h.runner}</span></div>
        <div class="cell score-cell"><b>${h.score.toFixed(1)}</b></div>
        ${oddsHtml(h, mark)}
        ${statsHtml(h)}${aptHtml(h)}${spHtml(h)}
      </div>`;
    }

    function stubCol() {
      const cls = ["id-row", "who", "runner", "score-cell", "odds-cell", "stats", "apt", "sp"];
      const rows = [
        { t: "番・脚", v: true },
        { t: "ウマ娘", v: true },
        { t: "トレーナー", v: false },
        { t: "評価点", v: false },
        { t: "印/オッズ", v: false, split: true },
        { t: "ステ", v: true },
        { t: "適性", v: true },
        { t: "SP", v: true },
      ];
      return `<div class="col stub-col">${rows.map((row, i) => {
        const mode = row.v ? "stub-v" : "stub-h";
        const extra = row.split ? " stub-split" : "";
        const inner = row.split
          ? row.t.split("/").map((p) => `<span>${p}</span>`).join("")
          : row.v ? `<span>${row.t}</span>` : row.t;
        return `<div class="cell stub-cell ${cls[i]} ${mode}${extra}">${inner}</div>`;
      }).join("")}</div>`;
    }
    function sheet(horses) {
      const marks = marksFor(horses);
      const nHead = horses.length;
      const cols = horses.map((h, i) => col(h, marks[i], nHead)).join("");
      return `<div class="paper">
        <div class="mast">
          <span class="title">お試しイベントレース</span>
          <span class="meta">中山　芝2000m　春・晴・良　｜　${horses.length}頭</span>
          <span class="keys">◎本命 ○対抗 ▲単穴 △穴　／　SP＝点数・有効・白・金　／　枠色は見た目のみ</span>
        </div>
        <div class="board" style="--n:${horses.length}">${stubCol()}${cols}</div>
      </div>`;
    }

    function fitWidth(el, minPx) {
      el.style.fontSize = "";
      let px = parseFloat(getComputedStyle(el).fontSize);
      while (el.scrollWidth > el.clientWidth + 0.5 && px > minPx) {
        px -= 0.4;
        el.style.fontSize = `${px}px`;
      }
    }
    function fitRunners(root) {
      root.querySelectorAll(".board .col:not(.stub-col) .runner span").forEach((el) => fitWidth(el, 7.5));
      root.querySelectorAll(".board .stub-col .runner").forEach((el) => fitWidth(el, 7));
    }
    let count = 16;
    function render() {
      const horses = ALL.slice(0, count);
      const wrap = document.getElementById("b");
      wrap.innerHTML = sheet(horses);
      fitRunners(wrap);
      document.getElementById("toolbar").innerHTML = [8, 12, 16, 18].map((n) =>
        `<button type="button" class="${n === count ? "on" : ""}" data-n="${n}">${n}頭</button>`
      ).join("");
    }
    document.getElementById("toolbar").addEventListener("click", (e) => {
      const n = Number(e.target.dataset.n);
      if (!n) return;
      count = n;
      render();
    });
    render();
  </script>
</body>
</html>
